<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept B — Rule Builder</title>
<style>
  :root {
    --bg: #0F0F13;
    --paper: #1A1A24;
    --primary: #7C3AED;
    --primary-light: #9F67FF;
    --primary-dim: rgba(124,58,237,0.15);
    --warning: #F59E0B;
    --error: #EF4444;
    --text: #E4E4E7;
    --text-secondary: #9999A8;
    --text-muted: #666680;
    --divider: rgba(255,255,255,0.07);
    --sleep-color: #6366F1;
    --sleep-bg: rgba(99,102,241,0.55);
    --awake-bg: rgba(34,197,94,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 40px 16px;
  }
  .dialog {
    background: var(--paper); border-radius: 12px;
    width: 100%; max-width: 640px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .dialog-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; border-bottom: 1px solid var(--divider);
  }
  .dialog-header h2 { font-size: 18px; font-weight: 600; }
  .close-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 20px; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: rgba(255,255,255,0.06); }
  .dialog-body { padding: 20px 24px; }
  .dialog-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px 24px; border-top: 1px solid var(--divider);
  }
  .field { margin-bottom: 16px; }
  .field-label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--divider); border-radius: 6px;
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .section-label {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
  .btn {
    padding: 9px 20px; border-radius: 6px; border: none;
    font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
  }
  .btn-ghost { background: none; color: var(--text-secondary); }
  .btn-ghost:hover { color: var(--text); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-light); }

  /* Rule card */
  .rule {
    border: 1px solid var(--divider); border-radius: 8px;
    padding: 16px; margin-bottom: 10px;
    background: rgba(255,255,255,0.015);
  }
  .rule:hover { border-color: rgba(255,255,255,0.1); }
  .rule-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .rule-num {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--primary-light);
  }
  .rule-del {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 15px; width: 26px; height: 26px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .rule-del:hover { background: rgba(239,68,68,0.12); color: var(--error); }

  /* Day pills */
  .day-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .dpill {
    padding: 5px 10px; border-radius: 14px; font-size: 12px;
    border: 1px solid var(--divider); background: none;
    color: var(--text-secondary); cursor: pointer; font-family: inherit;
    transition: all 0.1s;
  }
  .dpill.on { border-color: var(--primary); background: var(--primary-dim); color: var(--primary-light); }
  .dpill:hover { border-color: var(--primary); }
  .day-shortcuts { display: flex; gap: 8px; margin-bottom: 12px; }
  .shortcut {
    font-size: 11px; color: var(--primary-light); background: none;
    border: none; cursor: pointer; font-family: inherit;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .shortcut:hover { color: #fff; }

  /* All-day row */
  .allday {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 6px;
    background: rgba(99,102,241,0.06); border: 1px solid rgba(99,102,241,0.12);
    margin-bottom: 10px;
  }
  .allday input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; }
  .allday label { font-size: 13px; cursor: pointer; flex: 1; }
  .allday .hint { font-size: 11px; color: var(--text-muted); }

  /* Time row */
  .time-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .time-row.disabled { opacity: 0.3; pointer-events: none; }
  .time-row label { font-size: 12px; color: var(--text-secondary); }
  .time-row select {
    width: auto; padding: 6px 8px; font-size: 13px;
    background: rgba(255,255,255,0.05);
  }
  .overnight-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: rgba(245,158,11,0.12); color: var(--warning);
  }

  /* Add rule button */
  .add-rule {
    width: 100%; padding: 10px; border: 1px dashed var(--divider);
    border-radius: 6px; background: none; color: var(--text-secondary);
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all 0.15s; margin-bottom: 16px;
  }
  .add-rule:hover { border-color: var(--primary); color: var(--primary-light); }

  /* Preview */
  .preview {
    background: rgba(255,255,255,0.025); border: 1px solid var(--divider);
    border-radius: 8px; padding: 14px; margin-bottom: 6px;
  }
  .preview-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 8px;
  }
  .tl-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .tl-day { font-size: 11px; color: var(--text-secondary); width: 28px; text-align: right; flex-shrink: 0; }
  .tl-bar { flex: 1; height: 14px; display: flex; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.03); }
  .tl-seg { height: 100%; }
  .tl-seg.sleep { background: var(--sleep-bg); }
  .tl-seg.awake { background: var(--awake-bg); }
  .tl-legend { display: flex; gap: 14px; margin-top: 6px; font-size: 10px; color: var(--text-muted); }
  .tl-legend span { display: flex; align-items: center; gap: 4px; }
  .tl-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .cron-line {
    font-family: 'JetBrains Mono','Fira Code','SF Mono',monospace;
    font-size: 11px; color: var(--primary-light); margin-top: 8px; line-height: 1.6;
  }
  .warn-line { font-size: 11px; color: var(--warning); margin-top: 4px; }

  /* Collapse */
  .collapse-toggle {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; margin: 14px 0 6px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); background: none; border: none; font-family: inherit;
  }
  .collapse-toggle:hover { color: var(--text-secondary); }
  .collapse-toggle .arr { font-size: 10px; transition: transform 0.2s; }
  .collapse-toggle .arr.open { transform: rotate(90deg); }
  .collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s; }
  .row-settings { display: flex; gap: 12px; flex-wrap: wrap; }
  .row-settings .field { flex: 1; min-width: 140px; }
  .sw-row { display: flex; align-items: center; gap: 8px; }
  .sw {
    position: relative; width: 38px; height: 20px;
    background: rgba(255,255,255,0.12); border-radius: 10px;
    cursor: pointer; transition: background 0.2s;
  }
  .sw.on { background: var(--primary); }
  .sw .dot {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left 0.2s;
  }
  .sw.on .dot { left: 20px; }
</style>
</head>
<body>

<div class="dialog">
  <div class="dialog-header">
    <h2>New Policy</h2>
    <button class="close-btn">&times;</button>
  </div>
  <div class="dialog-body">
    <div class="field">
      <label class="field-label">Name</label>
      <input type="text" value="Weekend sleep" placeholder="e.g. Weekend sleep policy">
    </div>
    <div class="field">
      <label class="field-label">Description</label>
      <textarea rows="2" placeholder="Optional description..."></textarea>
    </div>

    <div class="section-label">
      Schedule rules
      <span style="margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--text-secondary)">
        TZ
        <select style="width:auto;padding:4px 8px;font-size:12px">
          <option>UTC</option><option>Europe/Berlin</option><option>America/New_York</option>
          <option>America/Los_Angeles</option><option>Asia/Tokyo</option>
        </select>
      </span>
    </div>

    <div id="rulesWrap"></div>
    <button class="add-rule" onclick="addRule()">+ Add sleep rule</button>

    <!-- Live preview -->
    <div class="preview">
      <div class="preview-label">Weekly preview</div>
      <div id="timeline"></div>
      <div class="tl-legend">
        <span><span class="tl-swatch" style="background:var(--sleep-bg)"></span> Sleep</span>
        <span><span class="tl-swatch" style="background:var(--awake-bg)"></span> Awake</span>
      </div>
      <div class="cron-line" id="cronOut"></div>
      <div class="warn-line" id="warnOut"></div>
    </div>

    <button class="collapse-toggle" onclick="toggle('extra')">
      <span class="arr" id="extraArr">&#9654;</span> Targeting &amp; Settings
    </button>
    <div class="collapse-body" id="extraBody">
      <div class="field" style="margin-top:10px">
        <label class="field-label">Namespace filter</label>
        <input type="text" placeholder="e.g. staging, dev  (empty = all)">
      </div>
      <div class="field">
        <label class="field-label">Label selector</label>
        <input type="text" placeholder="e.g. app=api, tier!=db">
      </div>
      <div class="row-settings">
        <div class="field">
          <label class="field-label">Mode</label>
          <select><option>Plan (dry-run)</option><option>Apply (live)</option></select>
        </div>
        <div class="field">
          <label class="field-label">Timeout (min)</label>
          <input type="number" value="30" min="0" max="1440">
        </div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:8px">
          <div class="sw-row">
            <div class="sw on" onclick="this.classList.toggle('on')"><div class="dot"></div></div>
            <span style="font-size:13px">Enabled</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="dialog-footer">
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-primary">Create Policy</button>
  </div>
</div>

<script>
const LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CRON_DOW = [1,2,3,4,5,6,0]; // display-idx → cron DOW

let rules = [];
let uid = 0;

function addRule(cfg) {
  rules.push({
    id: ++uid,
    days: cfg?.days || [],
    allDay: cfg?.allDay ?? false,
    startH: cfg?.startH ?? 19, startM: cfg?.startM ?? 0,
    endH: cfg?.endH ?? 7, endM: cfg?.endM ?? 0,
  });
  render();
}

function removeRule(id) { rules = rules.filter(r => r.id !== id); render(); }

function render() {
  const wrap = document.getElementById('rulesWrap');
  wrap.innerHTML = '';
  rules.forEach((r, idx) => {
    const isON = !r.allDay && ((r.endH < r.startH) || (r.endH === r.startH && r.endM <= r.startM));
    const card = document.createElement('div');
    card.className = 'rule';
    card.innerHTML = `
      <div class="rule-head">
        <span class="rule-num">Rule ${idx+1}</span>
        ${rules.length > 1 ? `<button class="rule-del" onclick="removeRule(${r.id})" title="Remove">&times;</button>` : ''}
      </div>

      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">On these days, keep workloads <strong style="color:var(--sleep-color)">asleep</strong>:</div>

      <div class="day-row">
        ${LABELS.map((l,i) => `<button class="dpill ${r.days.includes(i)?'on':''}" onclick="togDay(${r.id},${i})">${l}</button>`).join('')}
      </div>
      <div class="day-shortcuts">
        <button class="shortcut" onclick="setDays(${r.id},[0,1,2,3,4])">Weekdays</button>
        <button class="shortcut" onclick="setDays(${r.id},[5,6])">Weekends</button>
        <button class="shortcut" onclick="setDays(${r.id},[0,1,2,3,4,5,6])">Every day</button>
      </div>

      <div class="allday">
        <input type="checkbox" id="ad${r.id}" ${r.allDay?'checked':''}
          onchange="setAllDay(${r.id},this.checked)">
        <label for="ad${r.id}">All day (no wake-up on these days)</label>
        ${r.allDay ? '<span class="hint">Stays asleep 00:00\u201323:59</span>' : ''}
      </div>

      <div class="time-row ${r.allDay?'disabled':''}">
        <label>Sleep at</label>
        <select onchange="setT(${r.id},'startH',+this.value)">${hOpts(r.startH)}</select>
        <span>:</span>
        <select onchange="setT(${r.id},'startM',+this.value)">${mOpts(r.startM)}</select>
        <label style="margin-left:6px">Wake at</label>
        <select onchange="setT(${r.id},'endH',+this.value)">${hOpts(r.endH)}</select>
        <span>:</span>
        <select onchange="setT(${r.id},'endM',+this.value)">${mOpts(r.endM)}</select>
        ${isON ? '<span class="overnight-tag">next day</span>' : ''}
      </div>
    `;
    wrap.appendChild(card);
  });
  updatePreview();
}

function hOpts(sel) {
  let o = '';
  for (let h=0;h<24;h++) o += `<option value="${h}" ${h===sel?'selected':''}>${h.toString().padStart(2,'0')}</option>`;
  return o;
}
function mOpts(sel) {
  let o = '';
  [0,5,10,15,20,25,30,35,40,45,50,55].forEach(m => {
    o += `<option value="${m}" ${m===sel?'selected':''}>${m.toString().padStart(2,'0')}</option>`;
  });
  return o;
}

function togDay(id, di) {
  const r = rules.find(x=>x.id===id);
  const i = r.days.indexOf(di);
  if (i>=0) r.days.splice(i,1); else r.days.push(di);
  r.days.sort((a,b)=>a-b);
  render();
}
function setDays(id, ds) { rules.find(x=>x.id===id).days = ds; render(); }
function setAllDay(id, v) { rules.find(x=>x.id===id).allDay = v; render(); }
function setT(id, f, v) { rules.find(x=>x.id===id)[f] = v; render(); }

function updatePreview() {
  const G = {};
  LABELS.forEach((_, di) => { for (let h=0;h<24;h++) G[`${di}-${h}`] = 'awake'; });

  rules.forEach(r => {
    if (!r.days.length) return;
    r.days.forEach(di => {
      if (r.allDay) {
        for (let h=0;h<24;h++) G[`${di}-${h}`] = 'sleep';
      } else {
        const isON = (r.endH < r.startH) || (r.endH === r.startH && r.endM <= r.startM);
        if (isON) {
          // overnight: sleep startH→23, next day 0→endH
          for (let h=r.startH;h<24;h++) G[`${di}-${h}`] = 'sleep';
          const ni = (di+1) % 7;
          for (let h=0;h<r.endH;h++) G[`${ni}-${h}`] = 'sleep';
          if (r.endM > 0) G[`${ni}-${r.endH}`] = 'sleep'; // partial hour
        } else {
          for (let h=r.startH;h<r.endH;h++) G[`${di}-${h}`] = 'sleep';
          if (r.endM > 0) G[`${di}-${r.endH}`] = 'sleep'; // partial hour
        }
      }
    });
  });

  const el = document.getElementById('timeline');
  el.innerHTML = '';
  LABELS.forEach((label, di) => {
    const row = document.createElement('div');
    row.className = 'tl-row';
    let html = `<span class="tl-day">${label}</span><div class="tl-bar">`;
    for (let h=0;h<24;h++) {
      html += `<div class="tl-seg ${G[`${di}-${h}`]}" style="flex:1" title="${label} ${h}:00"></div>`;
    }
    html += '</div>';
    row.innerHTML = html;
    el.appendChild(row);
  });

  const cronEl = document.getElementById('cronOut');
  const warnEl = document.getElementById('warnOut');
  const sleepExprs = [], wakeExprs = [];
  const warns = [];

  rules.forEach(r => {
    if (!r.days.length) return;
    const cronDays = r.days.map(d => CRON_DOW[d]).sort((a,b)=>a-b).join(',');

    if (r.allDay) {
      sleepExprs.push(`0 0 * * ${cronDays}`);
      const allSleepIdxs = new Set();
      rules.forEach(rx => { if (rx.allDay) rx.days.forEach(d => allSleepIdxs.add(d)); });
      const wakeIdx = [0,1,2,3,4,5,6].find(d => !allSleepIdxs.has(d));
      if (wakeIdx !== undefined) {
        wakeExprs.push(`0 0 * * ${CRON_DOW[wakeIdx]}`);
      } else {
        warns.push('Every day is all-day sleep \u2014 workloads will never wake.');
      }
    } else {
      sleepExprs.push(`${r.startM} ${r.startH} * * ${cronDays}`);
      const isON = (r.endH < r.startH) || (r.endH === r.startH && r.endM <= r.startM);
      if (isON) {
        const wakeDays = r.days.map(d => CRON_DOW[(d+1) % 7]).sort((a,b)=>a-b).join(',');
        wakeExprs.push(`${r.endM} ${r.endH} * * ${wakeDays}`);
      } else {
        wakeExprs.push(`${r.endM} ${r.endH} * * ${cronDays}`);
      }
    }
  });

  const dedup = arr => [...new Set(arr)];
  const sl = dedup(sleepExprs);
  const wk = dedup(wakeExprs);
  cronEl.innerHTML = rules.length && rules.some(r=>r.days.length)
    ? `sleep: ${sl.join(' ; ')}<br>wake: &nbsp;${wk.join(' ; ')}`
    : '';
  warnEl.textContent = warns.length ? '\u26A0 ' + warns.join(' ') : '';
}

function toggle(id) {
  const body = document.getElementById(id + 'Body');
  const arr  = document.getElementById(id + 'Arr');
  const open = body.style.maxHeight && body.style.maxHeight !== '0px';
  body.style.maxHeight = open ? '0px' : '500px';
  arr.classList.toggle('open', !open);
}

addRule({ days: [5,6], allDay: true });
</script>
</body>
</html>
