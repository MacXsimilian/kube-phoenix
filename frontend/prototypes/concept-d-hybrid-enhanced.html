<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept D — Hybrid Enhanced</title>
<style>
  :root {
    --bg: #0F0F13;
    --paper: #1A1A24;
    --primary: #7C3AED;
    --primary-light: #9F67FF;
    --primary-dim: rgba(124,58,237,0.15);
    --warning: #F59E0B;
    --error: #EF4444;
    --text: #E4E4E7;
    --text-secondary: #9999A8;
    --text-muted: #666680;
    --divider: rgba(255,255,255,0.07);
    --sleep-color: #6366F1;
    --sleep-bg: rgba(99,102,241,0.55);
    --awake-bg: rgba(34,197,94,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 40px 16px;
  }
  .dialog {
    background: var(--paper); border-radius: 12px;
    width: 100%; max-width: 640px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .dialog-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; border-bottom: 1px solid var(--divider);
  }
  .dialog-header h2 { font-size: 18px; font-weight: 600; }
  .close-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 20px; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: rgba(255,255,255,0.06); }
  .dialog-body { padding: 20px 24px; }
  .dialog-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px 24px; border-top: 1px solid var(--divider);
  }
  .field { margin-bottom: 16px; }
  .field-label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--divider); border-radius: 6px;
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .section-label {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
  .btn {
    padding: 9px 20px; border-radius: 6px; border: none;
    font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
  }
  .btn-ghost { background: none; color: var(--text-secondary); }
  .btn-ghost:hover { color: var(--text); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-light); }

  /* Mode toggle */
  .mode-toggle {
    display: flex; border: 1px solid var(--divider); border-radius: 6px;
    overflow: hidden; width: fit-content; margin-bottom: 12px;
  }
  .mode-toggle button {
    padding: 6px 16px; border: none; background: none;
    color: var(--text-secondary); font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .mode-toggle button.active {
    background: var(--primary-dim); color: var(--primary-light);
  }

  /* Presets */
  .presets { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip {
    padding: 5px 12px; border-radius: 16px;
    border: 1px solid var(--divider); background: none;
    color: var(--text-secondary); font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary-light); }
  .chip.active { border-color: var(--primary); background: var(--primary-dim); color: var(--primary-light); }

  /* Window card */
  .win {
    border: 1px solid var(--divider); border-radius: 8px;
    padding: 16px; margin-bottom: 10px;
    background: rgba(255,255,255,0.015);
  }
  .win-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .win-num { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .win-del {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px;
  }
  .win-del:hover { color: var(--error); background: rgba(239,68,68,0.1); }

  /* Day buttons */
  .days { display: flex; gap: 4px; margin-bottom: 10px; }
  .dbtn {
    width: 40px; height: 32px; border-radius: 6px;
    border: 1px solid var(--divider); background: none;
    color: var(--text-secondary); font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit; display: flex;
    align-items: center; justify-content: center;
  }
  .dbtn.on { border-color: var(--primary); background: var(--primary-dim); color: var(--primary-light); }
  .dbtn:hover { border-color: var(--primary); }

  /* All-day */
  .allday {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 6px;
    background: rgba(99,102,241,0.06); border: 1px solid rgba(99,102,241,0.12);
    margin-bottom: 10px;
  }
  .allday input { accent-color: var(--primary); width: 16px; height: 16px; }
  .allday label { font-size: 13px; cursor: pointer; flex: 1; }
  .allday .hint { font-size: 11px; color: var(--text-muted); }

  /* Time pickers */
  .times { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .times.disabled { opacity: 0.25; pointer-events: none; }
  .times label { font-size: 12px; color: var(--text-secondary); }
  .times select {
    width: auto; padding: 6px 8px; font-size: 13px;
    background: rgba(255,255,255,0.05);
  }
  .overnight-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: rgba(245,158,11,0.12); color: var(--warning);
  }

  .add-win {
    width: 100%; padding: 10px; border: 1px dashed var(--divider);
    border-radius: 6px; background: none; color: var(--text-secondary);
    font-size: 13px; cursor: pointer; font-family: inherit; margin-bottom: 14px;
  }
  .add-win:hover { border-color: var(--primary); color: var(--primary-light); }

  /* Cron mode */
  .cron-section { display: none; }
  .cron-section.active { display: block; }
  .windows-section { display: block; }
  .windows-section.hidden { display: none; }
  .cron-field { margin-bottom: 12px; }
  .cron-field label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;
  }
  .cron-field input {
    font-family: 'JetBrains Mono','Fira Code','SF Mono',monospace;
    color: var(--primary-light);
  }
  .cron-field .helper {
    font-size: 11px; color: var(--text-muted); margin-top: 4px;
    font-family: 'JetBrains Mono','Fira Code','SF Mono',monospace;
  }

  /* Preview */
  .preview {
    background: rgba(255,255,255,0.02); border: 1px solid var(--divider);
    border-radius: 8px; padding: 14px; margin-bottom: 12px;
  }
  .preview-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 8px;
  }
  .wt-hours { display: flex; margin-left: 34px; margin-bottom: 3px; }
  .wt-hour { flex: 1; font-size: 9px; color: var(--text-muted); text-align: center; }
  .wt-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .wt-day { font-size: 11px; color: var(--text-secondary); width: 28px; text-align: right; flex-shrink: 0; }
  .wt-bar { flex: 1; height: 16px; display: flex; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.02); }
  .wt-seg { height: 100%; }
  .wt-seg.sleep { background: var(--sleep-bg); }
  .wt-seg.awake { background: var(--awake-bg); }
  .wt-legend { display: flex; gap: 14px; margin-top: 6px; font-size: 10px; color: var(--text-muted); }
  .wt-legend span { display: flex; align-items: center; gap: 4px; }
  .wt-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .cron-output {
    font-family: 'JetBrains Mono','Fira Code','SF Mono',monospace;
    font-size: 11px; color: var(--primary-light); margin-top: 8px; line-height: 1.6;
  }

  /* Collapse */
  .collapse-toggle {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; margin: 14px 0 6px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); background: none; border: none; font-family: inherit;
  }
  .collapse-toggle:hover { color: var(--text-secondary); }
  .collapse-toggle .arr { font-size: 10px; transition: transform 0.2s; }
  .collapse-toggle .arr.open { transform: rotate(90deg); }
  .collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s; }
  .row-settings { display: flex; gap: 12px; flex-wrap: wrap; }
  .row-settings .field { flex: 1; min-width: 130px; }
  .sw-row { display: flex; align-items: center; gap: 8px; }
  .sw {
    position: relative; width: 38px; height: 20px;
    background: rgba(255,255,255,0.12); border-radius: 10px;
    cursor: pointer; transition: background 0.2s;
  }
  .sw.on { background: var(--primary); }
  .sw .dot {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left 0.2s;
  }
  .sw.on .dot { left: 20px; }
</style>
</head>
<body>

<div class="dialog">
  <div class="dialog-header">
    <h2>New Policy</h2>
    <button class="close-btn">&times;</button>
  </div>
  <div class="dialog-body">
    <div class="field">
      <label class="field-label">Name</label>
      <input type="text" value="Weekend sleep" placeholder="e.g. Weekend sleep policy">
    </div>
    <div class="field">
      <label class="field-label">Description</label>
      <textarea rows="2" placeholder="Optional description..."></textarea>
    </div>

    <div class="section-label">
      Schedule
      <span style="margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--text-secondary)">
        TZ
        <select id="tzSelect" style="width:auto;padding:4px 8px;font-size:12px">
          <option>UTC</option><option>Europe/Berlin</option><option>Europe/London</option>
          <option>America/New_York</option><option>America/Los_Angeles</option><option>Asia/Tokyo</option>
        </select>
      </span>
    </div>

    <div class="mode-toggle">
      <button class="active" id="modeWin" onclick="setMode('windows')">Windows</button>
      <button id="modeCron" onclick="setMode('cron')">Cron</button>
    </div>

    <!-- WINDOWS MODE -->
    <div class="windows-section" id="winSection">
      <div class="presets" id="presets">
        <button class="chip" data-p="weeknights">Weekday nights</button>
        <button class="chip" data-p="weekends">Weekends</button>
        <button class="chip" data-p="nights+weekends">Nights + weekends</button>
        <button class="chip" data-p="always-awake">Always awake</button>
      </div>
      <div id="winsWrap"></div>
      <button class="add-win" onclick="addWin()">+ Add another window</button>
    </div>

    <!-- CRON MODE -->
    <div class="cron-section" id="cronSection">
      <div class="cron-field">
        <label>&#9789; Sleep cron</label>
        <input type="text" id="sleepCronIn" placeholder="0 19 * * 1-5" oninput="updatePreview()">
        <div class="helper">minute &nbsp;hour &nbsp;day-of-month &nbsp;month &nbsp;day-of-week</div>
      </div>
      <div class="cron-field">
        <label>&#9728;&#65039; Wake cron</label>
        <input type="text" id="wakeCronIn" placeholder="0 7 * * 1-5" oninput="updatePreview()">
        <div class="helper">minute &nbsp;hour &nbsp;day-of-month &nbsp;month &nbsp;day-of-week</div>
      </div>
    </div>

    <!-- LIVE PREVIEW -->
    <div class="preview" id="previewBox">
      <div class="preview-label">Live preview</div>
      <div class="wt-hours" id="hourLabels"></div>
      <div id="tlRows"></div>
      <div class="wt-legend">
        <span><span class="wt-swatch" style="background:var(--sleep-bg)"></span> Sleep</span>
        <span><span class="wt-swatch" style="background:var(--awake-bg)"></span> Awake</span>
      </div>
      <div class="cron-output" id="cronOut"></div>
    </div>

    <button class="collapse-toggle" onclick="toggle('extra')">
      <span class="arr" id="extraArr">&#9654;</span> Targeting &amp; Settings
    </button>
    <div class="collapse-body" id="extraBody">
      <div class="field" style="margin-top:10px">
        <label class="field-label">Namespace filter</label>
        <input type="text" placeholder="e.g. staging, dev  (empty = all)">
      </div>
      <div class="field">
        <label class="field-label">Label selector</label>
        <input type="text" placeholder="e.g. app=api, tier!=db">
      </div>
      <div class="row-settings">
        <div class="field">
          <label class="field-label">Mode</label>
          <select><option>Plan (dry-run)</option><option>Apply (live)</option></select>
        </div>
        <div class="field">
          <label class="field-label">Timeout (min)</label>
          <input type="number" value="30" min="0" max="1440">
        </div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:8px">
          <div class="sw-row">
            <div class="sw on" onclick="this.classList.toggle('on')"><div class="dot"></div></div>
            <span style="font-size:13px">Enabled</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="dialog-footer">
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-primary">Create Policy</button>
  </div>
</div>

<script>
const LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CRON_DOW = [1,2,3,4,5,6,0]; // display-idx → cron DOW
const CRON_TO_DISP = {0:6, 1:0, 2:1, 3:2, 4:3, 5:4, 6:5, 7:6}; // cron dow → display-idx

let mode = 'windows';
let wins = [];
let uid = 0;

function setMode(m) {
  mode = m;
  document.getElementById('modeWin').className = m === 'windows' ? 'active' : '';
  document.getElementById('modeCron').className = m === 'cron' ? 'active' : '';
  document.getElementById('winSection').className = m === 'windows' ? 'windows-section' : 'windows-section hidden';
  document.getElementById('cronSection').className = m === 'cron' ? 'cron-section active' : 'cron-section';
  updatePreview();
}

function addWin(cfg) {
  wins.push({
    id: ++uid,
    days: cfg?.days || [],
    allDay: cfg?.allDay ?? false,
    startH: cfg?.startH ?? 19, startM: cfg?.startM ?? 0,
    endH: cfg?.endH ?? 7, endM: cfg?.endM ?? 0,
  });
  renderWins();
}

function delWin(id) { wins = wins.filter(w => w.id !== id); renderWins(); }

function renderWins() {
  const wrap = document.getElementById('winsWrap');
  wrap.innerHTML = '';
  wins.forEach((w, idx) => {
    const isON = !w.allDay && (w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM));
    const card = document.createElement('div');
    card.className = 'win';
    card.innerHTML = `
      <div class="win-head">
        <span class="win-num">Window ${idx+1}</span>
        ${wins.length > 1 ? `<button class="win-del" onclick="delWin(${w.id})">&times;</button>` : ''}
      </div>
      <div class="days">
        ${LABELS.map((l,di) => `<button class="dbtn ${w.days.includes(di)?'on':''}" onclick="togDay(${w.id},${di})">${l}</button>`).join('')}
      </div>
      <div class="allday">
        <input type="checkbox" id="ad${w.id}" ${w.allDay?'checked':''} onchange="setAD(${w.id},this.checked)">
        <label for="ad${w.id}">All day (no wake-up)</label>
        ${w.allDay ? '<span class="hint">Stays asleep 00:00\u201323:59</span>' : ''}
      </div>
      <div class="times ${w.allDay ? 'disabled' : ''}">
        <label>Sleep at</label>
        <select onchange="setT(${w.id},'startH',+this.value)">${hO(w.startH)}</select>
        <span>:</span>
        <select onchange="setT(${w.id},'startM',+this.value)">${mO(w.startM)}</select>
        <label style="margin-left:8px">Wake at</label>
        <select onchange="setT(${w.id},'endH',+this.value)">${hO(w.endH)}</select>
        <span>:</span>
        <select onchange="setT(${w.id},'endM',+this.value)">${mO(w.endM)}</select>
        ${isON ? '<span class="overnight-tag">next day</span>' : ''}
      </div>
    `;
    wrap.appendChild(card);
  });
  updatePreview();
}

function hO(s) { let o=''; for(let h=0;h<24;h++) o+=`<option value="${h}" ${h===s?'selected':''}>${String(h).padStart(2,'0')}</option>`; return o; }
function mO(s) { let o=''; [0,5,10,15,20,25,30,35,40,45,50,55].forEach(m=>{o+=`<option value="${m}" ${m===s?'selected':''}>${String(m).padStart(2,'0')}</option>`;}); return o; }

function togDay(id, di) {
  const w = wins.find(x=>x.id===id);
  const i = w.days.indexOf(di);
  if (i>=0) w.days.splice(i,1); else w.days.push(di);
  w.days.sort((a,b)=>a-b);
  renderWins();
}
function setAD(id, v) { wins.find(x=>x.id===id).allDay = v; renderWins(); }
function setT(id, f, v) { wins.find(x=>x.id===id)[f] = v; renderWins(); }

const PRESETS = {
  weeknights: [{ days: [0,1,2,3,4], startH: 19, startM: 0, endH: 7, endM: 0 }],
  weekends: [{ days: [5,6], allDay: true }],
  'nights+weekends': [
    { days: [0,1,2,3,4], startH: 19, startM: 0, endH: 7, endM: 0 },
    { days: [5,6], allDay: true },
  ],
  'always-awake': [{ days: [] }],
};

document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  wins = [];
  uid = 0;
  const preset = PRESETS[btn.dataset.p];
  if (preset) preset.forEach(cfg => addWin(cfg));
  else addWin();
});

function updatePreview() {
  const G = {};
  LABELS.forEach((_, di) => { for (let h = 0; h < 24; h++) G[`${di}-${h}`] = 'awake'; });

  if (mode === 'windows') {
    wins.forEach(w => {
      w.days.forEach(di => {
        if (w.allDay) {
          for (let h = 0; h < 24; h++) G[`${di}-${h}`] = 'sleep';
        } else {
          const isON = w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM);
          if (isON) {
            for (let h = w.startH; h < 24; h++) G[`${di}-${h}`] = 'sleep';
            const ni = (di + 1) % 7;
            for (let h = 0; h < w.endH; h++) G[`${ni}-${h}`] = 'sleep';
            if (w.endM > 0) G[`${ni}-${w.endH}`] = 'sleep';
          } else {
            for (let h = w.startH; h < w.endH; h++) G[`${di}-${h}`] = 'sleep';
            if (w.endM > 0) G[`${di}-${w.endH}`] = 'sleep';
          }
        }
      });
    });
  } else {
    applyCronToGrid(document.getElementById('sleepCronIn').value.trim(), 'sleep', G);
    applyCronToGrid(document.getElementById('wakeCronIn').value.trim(), 'awake', G);
  }

  const hlEl = document.getElementById('hourLabels');
  hlEl.innerHTML = '';
  for (let h = 0; h < 24; h += 3) {
    const d = document.createElement('div');
    d.className = 'wt-hour'; d.style.flex = '3'; d.textContent = h;
    hlEl.appendChild(d);
  }

  const rows = document.getElementById('tlRows');
  rows.innerHTML = '';
  LABELS.forEach((l, di) => {
    const row = document.createElement('div');
    row.className = 'wt-row';
    let h = `<span class="wt-day">${l}</span><div class="wt-bar">`;
    for (let hr = 0; hr < 24; hr++) h += `<div class="wt-seg ${G[`${di}-${hr}`]}" style="flex:1"></div>`;
    h += '</div>';
    row.innerHTML = h;
    rows.appendChild(row);
  });

  const cronEl = document.getElementById('cronOut');
  if (mode === 'cron') {
    const sc = document.getElementById('sleepCronIn').value.trim();
    const wc = document.getElementById('wakeCronIn').value.trim();
    cronEl.innerHTML = `sleep: ${sc || '\u2014'}<br>wake: &nbsp;${wc || '\u2014'}`;
  } else {
    const { sleepCrons, wakeCrons } = computeWinCron();
    cronEl.innerHTML = (sleepCrons.length || wakeCrons.length)
      ? `sleep: ${sleepCrons.join(' ; ') || '\u2014'}<br>wake: &nbsp;${wakeCrons.join(' ; ') || '\u2014'}`
      : '';
  }
}

function computeWinCron() {
  const sleepExprs = [], wakeExprs = [];
  const allSleepDays = new Set();
  wins.forEach(w => { if (w.allDay) w.days.forEach(d => allSleepDays.add(d)); });

  wins.forEach(w => {
    if (!w.days.length) return;
    const cronDays = w.days.map(d => CRON_DOW[d]).sort((a,b) => a-b).join(',');
    if (w.allDay) {
      sleepExprs.push(`0 0 * * ${cronDays}`);
      const wakeIdx = [0,1,2,3,4,5,6].find(d => !allSleepDays.has(d));
      if (wakeIdx !== undefined) wakeExprs.push(`0 0 * * ${CRON_DOW[wakeIdx]}`);
    } else {
      sleepExprs.push(`${w.startM} ${w.startH} * * ${cronDays}`);
      const isON = w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM);
      const wakeDayStr = isON
        ? w.days.map(d => CRON_DOW[(d+1) % 7]).sort((a,b) => a-b).join(',')
        : cronDays;
      wakeExprs.push(`${w.endM} ${w.endH} * * ${wakeDayStr}`);
    }
  });
  return { sleepCrons: [...new Set(sleepExprs)], wakeCrons: [...new Set(wakeExprs)] };
}

function applyCronToGrid(expr, state, G) {
  if (!expr) return;
  const parts = expr.split(/\s+/);
  if (parts.length !== 5) return;
  const hour = parseInt(parts[1]);
  if (isNaN(hour)) return;

  const dowField = parts[4];
  let cronDays = [];
  if (dowField === '*') {
    cronDays = [0,1,2,3,4,5,6];
  } else {
    dowField.split(',').forEach(p => {
      if (p.includes('-')) {
        const [a, b] = p.split('-').map(Number);
        if (!isNaN(a) && !isNaN(b)) {
          for (let d = a; d <= b; d++) cronDays.push(d);
        }
      } else {
        const d = parseInt(p);
        if (!isNaN(d)) cronDays.push(d);
      }
    });
  }

  const displayDays = cronDays.map(d => CRON_TO_DISP[d]).filter(d => d !== undefined);
  displayDays.forEach(di => {
    if (state === 'sleep') {
      for (let h = hour; h < 24; h++) G[`${di}-${h}`] = 'sleep';
    } else {
      for (let h = hour; h < 24; h++) G[`${di}-${h}`] = 'awake';
    }
  });
}

function toggle(id) {
  const body = document.getElementById(id + 'Body');
  const arr  = document.getElementById(id + 'Arr');
  const open = body.style.maxHeight && body.style.maxHeight !== '0px';
  body.style.maxHeight = open ? '0px' : '500px';
  arr.classList.toggle('open', !open);
}
