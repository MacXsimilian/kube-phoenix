<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept C — Template Gallery</title>
<style>
  :root {
    --bg: #0F0F13;
    --paper: #1A1A24;
    --primary: #7C3AED;
    --primary-light: #9F67FF;
    --primary-dim: rgba(124,58,237,0.15);
    --warning: #F59E0B;
    --error: #EF4444;
    --text: #E4E4E7;
    --text-secondary: #9999A8;
    --text-muted: #666680;
    --divider: rgba(255,255,255,0.07);
    --sleep-color: #6366F1;
    --sleep-bg: rgba(99,102,241,0.55);
    --awake-bg: rgba(34,197,94,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 40px 16px;
  }
  .dialog {
    background: var(--paper); border-radius: 12px;
    width: 100%; max-width: 700px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .dialog-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; border-bottom: 1px solid var(--divider);
  }
  .dialog-header h2 { font-size: 18px; font-weight: 600; }
  .close-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 20px; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: rgba(255,255,255,0.06); }
  .dialog-body { padding: 20px 24px; }
  .dialog-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px 24px; border-top: 1px solid var(--divider);
  }
  .field { margin-bottom: 16px; }
  .field-label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--divider); border-radius: 6px;
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .section-label {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 14px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
  .btn {
    padding: 9px 20px; border-radius: 6px; border: none;
    font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
  }
  .btn-ghost { background: none; color: var(--text-secondary); }
  .btn-ghost:hover { color: var(--text); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-back {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 13px; font-family: inherit;
    display: flex; align-items: center; gap: 4px; margin-bottom: 14px;
  }
  .btn-back:hover { color: var(--text); }

  /* Template grid */
  .tpl-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  @media (max-width: 620px) { .tpl-grid { grid-template-columns: repeat(2, 1fr); } }
  .tpl-card {
    border: 2px solid var(--divider); border-radius: 10px;
    padding: 16px 12px; cursor: pointer; transition: all 0.2s;
    text-align: center; background: rgba(255,255,255,0.01);
  }
  .tpl-card:hover {
    border-color: rgba(124,58,237,0.35);
    background: rgba(124,58,237,0.04);
    transform: translateY(-2px);
  }
  .tpl-card.selected {
    border-color: var(--primary);
    background: rgba(124,58,237,0.08);
    box-shadow: 0 0 16px rgba(124,58,237,0.12);
  }
  .tpl-card.selected::after {
    content: '\2713'; position: absolute; top: 8px; right: 10px;
    color: var(--primary-light); font-size: 13px; font-weight: 700;
  }
  .tpl-card { position: relative; }
  .tpl-icon { font-size: 26px; margin-bottom: 6px; display: block; }
  .tpl-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .tpl-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 8px; }
  .tpl-mini {
    height: 7px; border-radius: 4px; display: flex; overflow: hidden;
    background: rgba(255,255,255,0.03); margin: 0 6px;
  }
  .tpl-mini div { height: 100%; }
  .tpl-mini .s { background: var(--sleep-bg); }
  .tpl-mini .a { background: var(--awake-bg); }

  /* Step 2: Customize */
  .step { display: none; }
  .step.active { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  /* Selected template summary */
  .tpl-summary {
    display: flex; align-items: center; gap: 12px;
    background: rgba(124,58,237,0.06); border: 1px solid rgba(124,58,237,0.15);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;
  }
  .tpl-summary .icon { font-size: 22px; }
  .tpl-summary .info { flex: 1; }
  .tpl-summary .title { font-size: 14px; font-weight: 600; }
  .tpl-summary .desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .change-link {
    font-size: 12px; color: var(--primary-light); background: none;
    border: none; cursor: pointer; font-family: inherit;
    text-decoration: underline; text-underline-offset: 2px;
  }

  /* Weekly timeline (preview) */
  .wt-box {
    background: rgba(255,255,255,0.02); border: 1px solid var(--divider);
    border-radius: 8px; padding: 14px; margin-bottom: 14px;
  }
  .wt-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 8px; }
  .wt-hours { display: flex; margin-left: 34px; margin-bottom: 3px; }
  .wt-hour { flex: 1; font-size: 9px; color: var(--text-muted); text-align: center; }
  .wt-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .wt-day { font-size: 11px; color: var(--text-secondary); width: 28px; text-align: right; flex-shrink: 0; }
  .wt-bar { flex: 1; height: 16px; display: flex; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.02); }
  .wt-seg { height: 100%; }
  .wt-seg.sleep { background: var(--sleep-bg); }
  .wt-seg.awake { background: var(--awake-bg); }
  .wt-legend { display: flex; gap: 14px; margin-top: 6px; font-size: 10px; color: var(--text-muted); }
  .wt-legend span { display: flex; align-items: center; gap: 4px; }
  .wt-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .cron-line {
    font-family: 'JetBrains Mono','Fira Code','SF Mono',monospace;
    font-size: 11px; color: var(--primary-light); margin-top: 8px; line-height: 1.6;
  }

  /* Expand-to-edit */
  .edit-toggle {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; font-size: 12px; color: var(--primary-light);
    margin-bottom: 10px; background: none; border: none; font-family: inherit;
  }
  .edit-toggle:hover { color: #fff; }
  .edit-body { display: none; }
  .edit-body.open { display: block; }

  /* Window editor */
  .win-card {
    border: 1px solid var(--divider); border-radius: 8px;
    padding: 14px; margin-bottom: 10px; background: rgba(255,255,255,0.015);
  }
  .win-card .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .win-card label { font-size: 12px; color: var(--text-secondary); }
  .win-card select {
    width: auto; padding: 5px 8px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--divider); border-radius: 4px;
    color: var(--text); font-size: 13px; font-family: inherit;
  }
  .dbtn {
    padding: 4px 9px; border-radius: 12px; font-size: 12px;
    border: 1px solid var(--divider); background: none;
    color: var(--text-secondary); cursor: pointer; font-family: inherit;
  }
  .dbtn.on { border-color: var(--primary); background: var(--primary-dim); color: var(--primary-light); }
  .dbtn:hover { border-color: var(--primary); }
  .allday-chk {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .allday-chk input { accent-color: var(--primary); }
  .allday-chk label { font-size: 13px; cursor: pointer; }
  .overnight-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: rgba(245,158,11,0.12); color: var(--warning);
  }
  .add-win {
    width: 100%; padding: 8px; border: 1px dashed var(--divider);
    border-radius: 6px; background: none; color: var(--text-secondary);
    font-size: 12px; cursor: pointer; font-family: inherit;
    margin-bottom: 10px;
  }
  .add-win:hover { border-color: var(--primary); color: var(--primary-light); }
  .del-win {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; margin-left: auto; padding: 2px 6px; border-radius: 4px;
  }
  .del-win:hover { color: var(--error); background: rgba(239,68,68,0.1); }

  /* Settings */
  .row-settings { display: flex; gap: 12px; flex-wrap: wrap; }
  .row-settings .field { flex: 1; min-width: 130px; }
  .sw-row { display: flex; align-items: center; gap: 8px; }
  .sw {
    position: relative; width: 38px; height: 20px;
    background: rgba(255,255,255,0.12); border-radius: 10px;
    cursor: pointer; transition: background 0.2s;
  }
  .sw.on { background: var(--primary); }
  .sw .dot {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: left 0.2s;
  }
  .sw.on .dot { left: 20px; }
</style>
</head>
<body>

<div class="dialog">
  <div class="dialog-header">
    <h2 id="dlgTitle">New Policy</h2>
    <button class="close-btn">&times;</button>
  </div>
  <div class="dialog-body">

    <!-- STEP 1 -->
    <div id="step1" class="step active">
      <div class="field">
        <label class="field-label">Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Weekend sleep policy">
      </div>

      <div class="section-label">Choose a schedule template</div>
      <div class="tpl-grid" id="tplGrid"></div>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step">
      <button class="btn-back" onclick="goBack()">&larr; Change template</button>

      <div class="tpl-summary" id="tplSummary"></div>

      <div class="wt-box" id="wtBox"></div>

      <button class="edit-toggle" onclick="toggleEdit()">
        <span id="editArr">&#9654;</span> Customize schedule...
      </button>
      <div class="edit-body" id="editBody"></div>

      <div class="section-label">Targeting</div>
      <div class="field">
        <label class="field-label">Namespace filter</label>
        <input type="text" placeholder="e.g. staging, dev  (empty = all)">
      </div>
      <div class="field">
        <label class="field-label">Label selector</label>
        <input type="text" placeholder="e.g. app=api, tier!=db">
      </div>

      <div class="section-label">Settings</div>
      <div class="row-settings">
        <div class="field">
          <label class="field-label">Timezone</label>
          <select>
            <option>UTC</option><option>Europe/Berlin</option><option>America/New_York</option>
            <option>America/Los_Angeles</option><option>Asia/Tokyo</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Mode</label>
          <select><option>Plan (dry-run)</option><option>Apply (live)</option></select>
        </div>
        <div class="field">
          <label class="field-label">Timeout (min)</label>
          <input type="number" value="30" min="0" max="1440">
        </div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:8px">
          <div class="sw-row">
            <div class="sw on" onclick="this.classList.toggle('on')"><div class="dot"></div></div>
            <span style="font-size:13px">Enabled</span>
          </div>
        </div>
      </div>
    </div>

  </div>
  <div class="dialog-footer">
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-primary" id="mainBtn" onclick="onMainBtn()">Next</button>
  </div>
</div>

<script>
const LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CRON_DOW = [1,2,3,4,5,6,0];

const TEMPLATES = [
  {
    id: 'weeknights', icon: '\u{1F319}', title: 'Weeknight sleep',
    desc: 'Mon\u2013Fri 7 PM \u2013 7 AM',
    windows: [{ days: [0,1,2,3,4], startH: 19, startM: 0, endH: 7, endM: 0, allDay: false }],
  },
  {
    id: 'weekends', icon: '\u{1F4C5}', title: 'Weekend sleep',
    desc: 'Sat & Sun, all day',
    windows: [{ days: [5,6], startH: 0, startM: 0, endH: 0, endM: 0, allDay: true }],
  },
  {
    id: 'nightswknd', icon: '\u{1F319}\u{1F4C5}', title: 'Nights + weekends',
    desc: 'Weeknights + Sat\u2013Sun all day',
    windows: [
      { days: [0,1,2,3,4], startH: 19, startM: 0, endH: 7, endM: 0, allDay: false },
      { days: [5,6], startH: 0, startM: 0, endH: 0, endM: 0, allDay: true },
    ],
  },
  {
    id: 'business', icon: '\u{23F0}', title: 'Business hours',
    desc: 'Awake Mon\u2013Fri 9\u20135 only',
    windows: [
      { days: [0,1,2,3,4], startH: 17, startM: 0, endH: 9, endM: 0, allDay: false },
      { days: [5,6], startH: 0, startM: 0, endH: 0, endM: 0, allDay: true },
    ],
  },
  {
    id: 'custom', icon: '\u270E', title: 'Custom',
    desc: 'Build your own schedule',
    windows: [{ days: [], startH: 19, startM: 0, endH: 7, endM: 0, allDay: false }],
  },
  {
    id: 'cron', icon: '\u{1F4BB}', title: 'Raw cron',
    desc: 'Enter cron expressions',
    windows: [], isCron: true,
  },
];

let selected = null;
let editWins = []; // deep-copied windows for editing

function initTemplates() {
  const grid = document.getElementById('tplGrid');
  TEMPLATES.forEach(t => {
    const card = document.createElement('div');
    card.className = 'tpl-card';
    card.id = `tpl-${t.id}`;
    card.onclick = () => selectTpl(t.id);

    const mini = buildMiniTimeline(t);
    card.innerHTML = `
      <span class="tpl-icon">${t.icon}</span>
      <div class="tpl-title">${t.title}</div>
      <div class="tpl-desc">${t.desc}</div>
      <div class="tpl-mini">${mini}</div>
    `;
    grid.appendChild(card);
  });
}

function buildMiniTimeline(t) {
  if (t.isCron) return '<div style="width:100%;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-muted)">0 19 * * 1-5</div>';
  const hrs = new Array(24).fill('a');
  (t.windows || []).forEach(w => {
    if (w.allDay) { hrs.fill('s'); return; }
    const isON = w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM);
    if (isON) {
      for (let h = w.startH; h < 24; h++) hrs[h] = 's';
      for (let h = 0; h < w.endH; h++) hrs[h] = 's';
    } else {
      for (let h = w.startH; h < w.endH; h++) hrs[h] = 's';
    }
  });
  return hrs.map(v => `<div class="${v === 's' ? 's' : 'a'}" style="flex:1"></div>`).join('');
}

function selectTpl(id) {
  document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`tpl-${id}`).classList.add('selected');
  selected = TEMPLATES.find(t => t.id === id);
}

function onMainBtn() {
  if (document.getElementById('step1').classList.contains('active')) {
    if (!selected) { alert('Pick a template first.'); return; }
    goToStep2();
  } else {
    alert('Policy created! (prototype)');
  }
}

function goToStep2() {
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('mainBtn').textContent = 'Create Policy';
  document.getElementById('dlgTitle').textContent = 'New Policy \u2014 Customize';

  const name = document.getElementById('nameInput').value || selected.title;

  document.getElementById('tplSummary').innerHTML = `
    <span class="icon">${selected.icon}</span>
    <div class="info"><div class="title">${name}</div><div class="desc">${selected.desc}</div></div>
    <button class="change-link" onclick="goBack()">Change</button>
  `;

  editWins = (selected.windows || []).map(w => ({ ...w, days: [...w.days] }));
  renderTimeline();
  renderEditor();
}

function goBack() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('mainBtn').textContent = 'Next';
  document.getElementById('dlgTitle').textContent = 'New Policy';
}

function renderTimeline() {
  const box = document.getElementById('wtBox');
  const G = {};
  LABELS.forEach((_, di) => { for (let h = 0; h < 24; h++) G[`${di}-${h}`] = 'awake'; });

  editWins.forEach(w => {
    w.days.forEach(di => {
      if (w.allDay) {
        for (let h = 0; h < 24; h++) G[`${di}-${h}`] = 'sleep';
      } else {
        const isON = w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM);
        if (isON) {
          for (let h = w.startH; h < 24; h++) G[`${di}-${h}`] = 'sleep';
          const ni = (di + 1) % 7;
          for (let h = 0; h < w.endH; h++) G[`${ni}-${h}`] = 'sleep';
          if (w.endM > 0) G[`${ni}-${w.endH}`] = 'sleep';
        } else {
          for (let h = w.startH; h < w.endH; h++) G[`${di}-${h}`] = 'sleep';
          if (w.endM > 0) G[`${di}-${w.endH}`] = 'sleep';
        }
      }
    });
  });

  let hoursHtml = '<div class="wt-hours">';
  for (let h = 0; h < 24; h += 3) hoursHtml += `<div class="wt-hour" style="flex:3">${h}</div>`;
  hoursHtml += '</div>';

  let rowsHtml = '';
  LABELS.forEach((l, di) => {
    rowsHtml += `<div class="wt-row"><span class="wt-day">${l}</span><div class="wt-bar">`;
    for (let h = 0; h < 24; h++) rowsHtml += `<div class="wt-seg ${G[`${di}-${h}`]}" style="flex:1"></div>`;
    rowsHtml += '</div></div>';
  });

  const { sleepCrons, wakeCrons } = computeCron();

  box.innerHTML = `
    <div class="wt-label">Weekly preview</div>
    ${hoursHtml}${rowsHtml}
    <div class="wt-legend">
      <span><span class="wt-swatch" style="background:var(--sleep-bg)"></span> Sleep</span>
      <span><span class="wt-swatch" style="background:var(--awake-bg)"></span> Awake</span>
    </div>
    <div class="cron-line">sleep: ${sleepCrons.join(' ; ') || '\u2014'}<br>wake: &nbsp;${wakeCrons.join(' ; ') || '\u2014'}</div>
  `;
}

function computeCron() {
  const sleepExprs = [], wakeExprs = [];
  const allSleepDays = new Set();
  editWins.forEach(w => { if (w.allDay) w.days.forEach(d => allSleepDays.add(d)); });

  editWins.forEach(w => {
    if (!w.days.length) return;
    const cronDays = w.days.map(d => CRON_DOW[d]).sort((a,b) => a-b).join(',');
    if (w.allDay) {
      sleepExprs.push(`0 0 * * ${cronDays}`);
      const wakeIdx = [0,1,2,3,4,5,6].find(d => !allSleepDays.has(d));
      if (wakeIdx !== undefined) wakeExprs.push(`0 0 * * ${CRON_DOW[wakeIdx]}`);
    } else {
      sleepExprs.push(`${w.startM} ${w.startH} * * ${cronDays}`);
      const isON = w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM);
      const wakeDayStr = isON
        ? w.days.map(d => CRON_DOW[(d+1) % 7]).sort((a,b) => a-b).join(',')
        : cronDays;
      wakeExprs.push(`${w.endM} ${w.endH} * * ${wakeDayStr}`);
    }
  });
  return { sleepCrons: [...new Set(sleepExprs)], wakeCrons: [...new Set(wakeExprs)] };
}

function renderEditor() {
  const body = document.getElementById('editBody');
  body.innerHTML = '';
  editWins.forEach((w, idx) => {
    const isON = !w.allDay && (w.endH < w.startH || (w.endH === w.startH && w.endM <= w.startM));
    const card = document.createElement('div');
    card.className = 'win-card';
    card.innerHTML = `
      <div class="row" style="margin-bottom:4px">
        <label style="font-weight:500;color:var(--text)">Window ${idx+1}</label>
        ${editWins.length > 1 ? `<button class="del-win" onclick="delWin(${idx})">&times;</button>` : ''}
      </div>
      <div class="row">
        ${LABELS.map((l,di) => `<button class="dbtn ${w.days.includes(di)?'on':''}" onclick="togWinDay(${idx},${di})">${l}</button>`).join('')}
      </div>
      <div class="allday-chk">
        <input type="checkbox" id="ad${idx}" ${w.allDay?'checked':''} onchange="setWinAllDay(${idx},this.checked)">
        <label for="ad${idx}">All day (no wake-up)</label>
      </div>
      ${!w.allDay ? `
        <div class="row">
          <label>Sleep at</label>
          <select onchange="setWinT(${idx},'startH',+this.value)">${hO(w.startH)}</select>
          <span>:</span>
          <select onchange="setWinT(${idx},'startM',+this.value)">${mO(w.startM)}</select>
          <label style="margin-left:6px">Wake at</label>
          <select onchange="setWinT(${idx},'endH',+this.value)">${hO(w.endH)}</select>
          <span>:</span>
          <select onchange="setWinT(${idx},'endM',+this.value)">${mO(w.endM)}</select>
          ${isON ? '<span class="overnight-tag">next day</span>' : ''}
        </div>
      ` : ''}
    `;
    body.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-win';
  addBtn.textContent = '+ Add another window';
  addBtn.onclick = () => { editWins.push({ days: [], startH: 19, startM: 0, endH: 7, endM: 0, allDay: false }); renderEditor(); renderTimeline(); };
  body.appendChild(addBtn);
}

function hO(s) { let o=''; for(let h=0;h<24;h++) o+=`<option value="${h}" ${h===s?'selected':''}>${String(h).padStart(2,'0')}</option>`; return o; }
function mO(s) { let o=''; [0,5,10,15,20,25,30,35,40,45,50,55].forEach(m=>{o+=`<option value="${m}" ${m===s?'selected':''}>${String(m).padStart(2,'0')}</option>`;}); return o; }

function togWinDay(i, di) {
  const w = editWins[i]; const j = w.days.indexOf(di);
  if (j >= 0) w.days.splice(j, 1); else w.days.push(di);
  w.days.sort((a,b) => a-b); renderEditor(); renderTimeline();
}
function setWinAllDay(i, v) { editWins[i].allDay = v; renderEditor(); renderTimeline(); }
function setWinT(i, f, v) { editWins[i][f] = v; renderEditor(); renderTimeline(); }
function delWin(i) { editWins.splice(i, 1); renderEditor(); renderTimeline(); }

function toggleEdit() {
  const body = document.getElementById('editBody');
  const arr = document.getElementById('editArr');
  const open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  arr.textContent = open ? '\u25B6' : '\u25BC';
}

initTemplates();
</script>
</body>
</html>
