<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept A — Schedule Painter</title>
<style>
  :root {
    --bg: #0F0F13;
    --paper: #1A1A24;
    --primary: #7C3AED;
    --primary-light: #9F67FF;
    --primary-dim: rgba(124,58,237,0.15);
    --warning: #F59E0B;
    --error: #EF4444;
    --text: #E4E4E7;
    --text-secondary: #9999A8;
    --text-muted: #666680;
    --divider: rgba(255,255,255,0.07);
    --sleep-color: #6366F1;
    --sleep-bg: rgba(99,102,241,0.6);
    --awake-color: #22C55E;
    --awake-bg: rgba(34,197,94,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 40px 16px;
  }

  /* Dialog shell */
  .dialog {
    background: var(--paper); border-radius: 12px;
    width: 100%; max-width: 700px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .dialog-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; border-bottom: 1px solid var(--divider);
  }
  .dialog-header h2 { font-size: 18px; font-weight: 600; }
  .close-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 20px; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: rgba(255,255,255,0.06); }
  .dialog-body { padding: 20px 24px; }
  .dialog-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px 24px; border-top: 1px solid var(--divider);
  }

  /* Form fields */
  .field { margin-bottom: 16px; }
  .field-label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--divider); border-radius: 6px;
    color: var(--text); font-size: 14px; font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  .section-label {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
  .inline-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .inline-row select, .inline-row input { width: auto; }

  /* Buttons */
  .btn {
    padding: 9px 20px; border-radius: 6px; border: none;
    font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
    transition: all 0.15s;
  }
  .btn-ghost { background: none; color: var(--text-secondary); }
  .btn-ghost:hover { color: var(--text); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-light); }

  /* Paint toggle */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .brush-group {
    display: flex; border: 1px solid var(--divider); border-radius: 6px; overflow: hidden;
  }
  .brush-group button {
    padding: 6px 14px; border: none; background: none;
    color: var(--text-secondary); font-size: 13px; font-family: inherit;
    cursor: pointer; transition: all 0.12s;
  }
  .brush-group button.active-sleep { background: var(--sleep-color); color: #fff; }
  .brush-group button.active-awake { background: var(--awake-color); color: #fff; }
  .toolbar-btn {
    padding: 5px 10px; background: none; border: 1px solid var(--divider);
    border-radius: 5px; color: var(--text-secondary); font-size: 12px;
    cursor: pointer; font-family: inherit; transition: all 0.12s;
  }
  .toolbar-btn:hover { border-color: var(--text-secondary); color: var(--text); }
  .toolbar-btn.danger:hover { border-color: var(--error); color: var(--error); }

  /* Presets */
  .presets { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    padding: 5px 12px; border-radius: 16px;
    border: 1px solid var(--divider); background: none;
    color: var(--text-secondary); font-size: 12px;
    cursor: pointer; font-family: inherit; transition: all 0.12s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary-light); }
  .chip.active { border-color: var(--primary); background: var(--primary-dim); color: var(--primary-light); }

  /* Grid */
  .grid-wrap { overflow-x: auto; margin-bottom: 10px; user-select: none; -webkit-user-select: none; }
  .grid { width: 100%; min-width: 540px; border-collapse: collapse; }
  .grid th {
    font-size: 10px; color: var(--text-muted); font-weight: 400;
    padding: 0 0 4px; text-align: center;
  }
  .grid th.row-label {
    text-align: right; padding-right: 6px; width: 36px;
    font-weight: 500; color: var(--text-secondary); cursor: pointer;
  }
  .grid th.row-label:hover { color: var(--primary-light); }
  .cell {
    height: 26px; border: 1px solid rgba(255,255,255,0.02);
    cursor: crosshair; transition: opacity 0.06s;
  }
  .cell.sleep { background: var(--sleep-bg); }
  .cell.awake { background: var(--awake-bg); }
  .cell:not(.sleep):not(.awake) { background: rgba(255,255,255,0.015); }
  .cell:not(.sleep):not(.awake):hover { background: rgba(255,255,255,0.05); }

  /* Legend */
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }

  /* Summary / Cron output */
  .output-box {
    background: rgba(255,255,255,0.025); border: 1px solid var(--divider);
    border-radius: 8px; padding: 12px 14px; font-size: 13px;
    line-height: 1.6; color: var(--text-secondary);
  }
  .output-box strong { color: var(--text); font-weight: 500; }
  .cron-line {
    font-family: 'JetBrains Mono','Fira Code','SF Mono',monospace;
    font-size: 12px; color: var(--primary-light); margin-top: 6px;
  }
  .output-box .warning {
    color: var(--warning); font-size: 12px; margin-top: 4px;
  }

  /* Collapsible */
  .collapse-toggle {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; margin: 16px 0 6px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); background: none; border: none; font-family: inherit;
  }
  .collapse-toggle:hover { color: var(--text-secondary); }
  .collapse-toggle .arr { font-size: 10px; transition: transform 0.2s; }
  .collapse-toggle .arr.open { transform: rotate(90deg); }
  .collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .row-settings { display: flex; gap: 12px; flex-wrap: wrap; }
  .row-settings .field { flex: 1; min-width: 140px; }
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .sw {
    position: relative; width: 38px; height: 20px;
    background: rgba(255,255,255,0.12); border-radius: 10px;
    cursor: pointer; transition: background 0.2s;
  }
  .sw.on { background: var(--primary); }
  .sw .dot {
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: left 0.2s;
  }
  .sw.on .dot { left: 20px; }
</style>
</head>
<body>

<div class="dialog">
  <div class="dialog-header">
    <h2>New Policy</h2>
    <button class="close-btn">&times;</button>
  </div>
  <div class="dialog-body">

    <!-- Name / Description -->
    <div class="field">
      <label class="field-label">Name</label>
      <input type="text" placeholder="e.g. Weekend sleep policy" value="Weekend sleep">
    </div>
    <div class="field">
      <label class="field-label">Description</label>
      <textarea rows="2" placeholder="Optional description..."></textarea>
    </div>

    <div class="section-label">
      Schedule
      <span style="margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--text-secondary)">
        TZ
        <select id="tz" style="width:auto;padding:4px 8px;font-size:12px">
          <option>UTC</option><option>Europe/Berlin</option><option>Europe/London</option>
          <option>America/New_York</option><option>America/Chicago</option><option>America/Los_Angeles</option>
          <option>Asia/Tokyo</option>
        </select>
      </span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span style="font-size:12px;color:var(--text-muted)">Brush:</span>
      <div class="brush-group">
        <button id="brSleep" class="active-sleep" onclick="setBrush('sleep')">&#9789; Sleep</button>
        <button id="brAwake" onclick="setBrush('awake')">&#9728; Awake</button>
      </div>
      <button class="toolbar-btn danger" onclick="clearAll()">Clear</button>
    </div>

    <!-- Presets -->
    <div class="presets" id="presets">
      <button class="chip" data-p="weeknights">Weekday nights</button>
      <button class="chip" data-p="weekends">Weekends</button>
      <button class="chip" data-p="nights+weekends">Nights + weekends</button>
      <button class="chip" data-p="business">Business hours</button>
    </div>

    <!-- Grid -->
    <div class="grid-wrap">
      <table class="grid" id="grid">
        <thead><tr id="gridHead"></tr></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

    <div class="legend">
      <span><span class="legend-swatch" style="background:var(--sleep-bg)"></span> Sleep</span>
      <span><span class="legend-swatch" style="background:var(--awake-bg)"></span> Awake</span>
      <span><span class="legend-swatch" style="background:rgba(255,255,255,0.02);border:1px solid var(--divider)"></span> Unset</span>
    </div>

    <!-- Output -->
    <div class="output-box" id="output">
      Paint sleep/wake blocks on the grid, or pick a preset above.
    </div>

    <!-- Targeting -->
    <button class="collapse-toggle" onclick="toggle('extra')">
      <span class="arr" id="extraArr">&#9654;</span> Targeting &amp; Settings
    </button>
    <div class="collapse-body" id="extraBody">
      <div class="field" style="margin-top:10px">
        <label class="field-label">Namespace filter</label>
        <input type="text" placeholder="e.g. staging, dev  (empty = all)">
      </div>
      <div class="field">
        <label class="field-label">Label selector</label>
        <input type="text" placeholder="e.g. app=api, tier!=db">
      </div>
      <div class="row-settings">
        <div class="field">
          <label class="field-label">Mode</label>
          <select><option>Plan (dry-run)</option><option>Apply (live)</option></select>
        </div>
        <div class="field">
          <label class="field-label">Timeout (min)</label>
          <input type="number" value="30" min="0" max="1440">
        </div>
        <div class="field" style="display:flex;align-items:flex-end;padding-bottom:8px">
          <div class="switch-row">
            <div class="sw on" onclick="this.classList.toggle('on')"><div class="dot"></div></div>
            <span style="font-size:13px">Enabled</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-primary">Create Policy</button>
  </div>
</div>

<script>
const LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CRON_DOW = [1,2,3,4,5,6,0]; // display-index → cron DOW

let brush = 'sleep';     // current paint mode
let painting = false;     // mouse-drag active?
const S = {};             // state: key "row-col" → 'sleep'|'awake'|undefined

function buildGrid() {
  const hRow = document.getElementById('gridHead');
  hRow.innerHTML = '<th style="width:36px"></th>';
  for (let h = 0; h < 24; h++) {
    const th = document.createElement('th');
    th.textContent = h;
    hRow.appendChild(th);
  }
  const tbody = document.getElementById('gridBody');
  LABELS.forEach((label, ri) => {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.className = 'row-label';
    th.textContent = label;
    th.title = `Fill entire ${label} with current brush`;
    th.onclick = () => fillRow(ri);
    tr.appendChild(th);
    for (let h = 0; h < 24; h++) {
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.r = ri;
      td.dataset.c = h;
      td.onmousedown = e => { painting = true; paint(td); e.preventDefault(); };
      td.onmouseenter = () => { if (painting) paint(td); };
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  document.addEventListener('mouseup', () => painting = false);
}

function paint(td) {
  const key = `${td.dataset.r}-${td.dataset.c}`;
  const cur = S[key];
  if (!painting) { // single click: toggle
    if (cur === brush) { delete S[key]; td.className = 'cell'; }
    else { S[key] = brush; td.className = `cell ${brush}`; }
  } else {
    S[key] = brush;
    td.className = `cell ${brush}`;
  }
  recomputeOutput();
}

function fillRow(ri) {
  for (let h = 0; h < 24; h++) {
    S[`${ri}-${h}`] = brush;
    const td = document.querySelector(`td[data-r="${ri}"][data-c="${h}"]`);
    if (td) td.className = `cell ${brush}`;
  }
  recomputeOutput();
}

function setBrush(b) {
  brush = b;
  document.getElementById('brSleep').className = b === 'sleep' ? 'active-sleep' : '';
  document.getElementById('brAwake').className = b === 'awake' ? 'active-awake' : '';
}

function clearAll() {
  Object.keys(S).forEach(k => delete S[k]);
  document.querySelectorAll('.cell').forEach(c => c.className = 'cell');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  recomputeOutput();
}

const PRESETS = {
  weeknights: () => {
    // Mon-Fri: sleep 19-24 & 0-7, awake 7-19
    for (let ri = 0; ri < 5; ri++) {
      for (let h = 0; h < 7; h++) S[`${ri}-${h}`] = 'sleep';
      for (let h = 7; h < 19; h++) S[`${ri}-${h}`] = 'awake';
      for (let h = 19; h < 24; h++) S[`${ri}-${h}`] = 'sleep';
    }
    // Sat morning bleed from Fri night
    for (let h = 0; h < 7; h++) S[`5-${h}`] = 'sleep';
    for (let h = 7; h < 24; h++) S[`5-${h}`] = 'awake';
    for (let h = 0; h < 7; h++) S[`6-${h}`] = 'sleep';
    for (let h = 7; h < 24; h++) S[`6-${h}`] = 'awake';
  },
  weekends: () => {
    for (let ri = 0; ri < 5; ri++) for (let h = 0; h < 24; h++) S[`${ri}-${h}`] = 'awake';
    for (let ri = 5; ri < 7; ri++) for (let h = 0; h < 24; h++) S[`${ri}-${h}`] = 'sleep';
  },
  'nights+weekends': () => {
    for (let ri = 0; ri < 5; ri++) {
      for (let h = 0; h < 7; h++) S[`${ri}-${h}`] = 'sleep';
      for (let h = 7; h < 19; h++) S[`${ri}-${h}`] = 'awake';
      for (let h = 19; h < 24; h++) S[`${ri}-${h}`] = 'sleep';
    }
    for (let ri = 5; ri < 7; ri++) for (let h = 0; h < 24; h++) S[`${ri}-${h}`] = 'sleep';
  },
  business: () => {
    for (let ri = 0; ri < 5; ri++) {
      for (let h = 0; h < 9; h++) S[`${ri}-${h}`] = 'sleep';
      for (let h = 9; h < 17; h++) S[`${ri}-${h}`] = 'awake';
      for (let h = 17; h < 24; h++) S[`${ri}-${h}`] = 'sleep';
    }
    for (let ri = 5; ri < 7; ri++) for (let h = 0; h < 24; h++) S[`${ri}-${h}`] = 'sleep';
  },
};

document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  clearAll();
  btn.classList.add('active');
  const fn = PRESETS[btn.dataset.p];
  if (fn) fn();
  syncCells();
  recomputeOutput();
});

function syncCells() {
  document.querySelectorAll('.cell').forEach(td => {
    const key = `${td.dataset.r}-${td.dataset.c}`;
    td.className = S[key] ? `cell ${S[key]}` : 'cell';
  });
}

function recomputeOutput() {
  const box = document.getElementById('output');

  const daySleep = LABELS.map((_, ri) => {
    const hrs = [];
    for (let h = 0; h < 24; h++) { if (S[`${ri}-${h}`] === 'sleep') hrs.push(h); }
    return hrs;
  });

  const hasSleep = daySleep.some(h => h.length > 0);
  if (!hasSleep) {
    box.innerHTML = 'Paint sleep/wake blocks on the grid, or pick a preset above.';
    return;
  }

  const groups = {};
  daySleep.forEach((hrs, ri) => {
    if (hrs.length === 0) return;
    const key = hrs.join(',');
    if (!groups[key]) groups[key] = { hrs, days: [] };
    groups[key].days.push(ri);
  });

  let html = '';
  const cronParts = [];
  const warnings = [];

  Object.values(groups).forEach(g => {
    const dayStr = compactDays(g.days);
    const ranges = hoursToRanges(g.hrs);
    const isAllDay = g.hrs.length === 24;

    if (isAllDay) {
      html += `<strong>${dayStr}</strong>: sleep all day<br>`;
    } else {
      html += `<strong>${dayStr}</strong>: sleep ${ranges.map(r => `${pad(r[0])}:00\u2013${pad(r[1])}:00`).join(' & ')}<br>`;
    }

    const cronDays = g.days.map(d => CRON_DOW[d]);
    const cronDayStr = cronDays.sort((a,b) => a-b).join(',');

    if (isAllDay) {
      cronParts.push({ type: 'sleep', expr: `0 0 * * ${cronDayStr}` });
      // Wake = first non-sleep day at 00:00
      const allSleepDays = new Set();
      daySleep.forEach((hrs, ri) => { if (hrs.length === 24) allSleepDays.add(ri); });
      const wakeDay = [0,1,2,3,4,5,6].find(d => !allSleepDays.has(d));
      if (wakeDay !== undefined) {
        cronParts.push({ type: 'wake', expr: `0 0 * * ${CRON_DOW[wakeDay]}` });
      } else {
        warnings.push('All days are set to sleep all day \u2014 no wake cron can be generated.');
      }
    } else {
      ranges.forEach(([start, end]) => {
        cronParts.push({ type: 'sleep', expr: `0 ${start} * * ${cronDayStr}` });
        // Wake: if end goes into next day, shift days forward
        if (end <= start) {
          const wakeDays = g.days.map(d => CRON_DOW[(d + 1) % 7]).sort((a,b) => a-b).join(',');
          cronParts.push({ type: 'wake', expr: `0 ${end} * * ${wakeDays}` });
        } else {
          cronParts.push({ type: 'wake', expr: `0 ${end} * * ${cronDayStr}` });
        }
      });
    }
  });

  const sleepCrons = [...new Set(cronParts.filter(p => p.type === 'sleep').map(p => p.expr))];
  const wakeCrons  = [...new Set(cronParts.filter(p => p.type === 'wake').map(p => p.expr))];

  html += `<div class="cron-line">`;
  html += `sleep: ${sleepCrons.join(' ; ') || '\u2014'}`;
  html += `<br>wake: &nbsp;${wakeCrons.join(' ; ') || '\u2014'}`;
  html += `</div>`;

  if (warnings.length) {
    html += `<div class="warning">\u26A0 ${warnings.join(' ')}</div>`;
  }

  box.innerHTML = html;
}

function pad(n) { return n.toString().padStart(2, '0'); }

function compactDays(indices) {
  const labels = indices.map(i => LABELS[i]);
  if (labels.length === 7) return 'Every day';
  if (indices.length === 5 && indices.join() === '0,1,2,3,4') return 'Mon\u2013Fri';
  if (indices.length === 2 && indices.join() === '5,6') return 'Sat\u2013Sun';
  // Check consecutive run
  if (indices.length >= 3) {
    let consecutive = true;
    for (let i = 1; i < indices.length; i++) {
      if (indices[i] !== indices[i-1] + 1) { consecutive = false; break; }
    }
    if (consecutive) return `${labels[0]}\u2013${labels[labels.length-1]}`;
  }
  return labels.join(', ');
}

function hoursToRanges(hrs) {
  if (!hrs.length) return [];
  const sorted = [...hrs].sort((a,b) => a-b);
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === end + 1) { end = sorted[i]; }
    else {
      ranges.push([start, end === 23 ? 24 : end + 1]);
      start = sorted[i]; end = sorted[i];
    }
  }
  ranges.push([start, end === 23 ? 24 : end + 1]);
  return ranges;
}

function toggle(id) {
  const body = document.getElementById(id + 'Body');
  const arr  = document.getElementById(id + 'Arr');
  const open = body.style.maxHeight && body.style.maxHeight !== '0px';
  body.style.maxHeight = open ? '0px' : '500px';
  arr.classList.toggle('open', !open);
}

buildGrid();
</script>
</body>
</html>
