openapi: "3.1.0"

info:
  title: kube-phoenix API
  description: |
    REST API for the kube-phoenix cluster sleep/wake policy engine.

    All `/api/*` and `/ws/*` endpoints require session-based authentication
    via HTTP-only cookies. `/healthz` and `/metrics` are always open.
    `/api/auth/login` and `/api/auth/oidc/*` are unauthenticated.

    Authenticate by calling `POST /api/auth/login` with username/password.
    The server sets a `__kp_session` HTTP-only cookie and a `__kp_csrf`
    cookie. Include the CSRF token as `X-CSRF-Token` header on mutations.

    WebSocket connections use cookies automatically on same-origin upgrades.
  version: "1.1.0"
  contact:
    name: kube-phoenix
    url: https://github.com/MacXsimilian/kube-phoenix
  license:
    name: Apache 2.0
    url: https://github.com/MacXsimilian/kube-phoenix/blob/master/LICENSE

externalDocs:
  description: Project documentation
  url: https://github.com/MacXsimilian/kube-phoenix#readme

servers:
  - url: /
    description: Same-origin (served by the Go binary)

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __kp_session

  schemas:
    LogLine:
      description: A single log entry within an execution.
      type: object
      properties:
        id:
          type: integer
        executionId:
          type: integer
        seq:
          type: integer
        level:
          type: string
          enum: [info, ok, plan, error, warn]
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    SessionInfo:
      description: An active user session.
      type: object
      properties:
        id:
          type: integer
        ipAddress:
          type: string
          example: "192.168.1.1:54321"
        userAgent:
          type: string
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          description: True if this is the session making the request.

    Guardrails:
      description: Global guardrail configuration that protects namespaces, nodes, and workloads from the scaler.
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        systemNamespaces:
          type: string
          example: "kube-system,kube-public,kube-node-lease,kube-phoenix"
          description: Protected system namespaces — always skipped. Comma-separated.
        skipNsNode:
          type: string
          example: "kube-system"
          description: Namespaces whose non-DaemonSet pods protect the node from drain. Comma-separated.
        skipNodeLabels:
          type: string
          example: "node-role.kubernetes.io/control-plane=true"
          description: Node label key=value pairs. Matching nodes are never drained. Comma-separated.
        skipNodeTaints:
          type: string
          example: "CriticalAddonsOnly=true:NoSchedule"
          description: Node taint key=value:effect entries. Matching nodes are never drained. Comma-separated.
        scalingPriorityNamespaces:
          type: string
          example: "payments,checkout,api-gateway"
          description: Ordered list of namespaces to scale first during sleep and wake. Comma-separated.
        scalingConcurrency:
          type: integer
          minimum: 1
          maximum: 50
          example: 10
          description: Max workloads scaled in parallel during sleep/wake. Default 10.
        schedulerEvalInterval:
          type: string
          example: "30s"
          description: How often policies are evaluated. Accepts Go duration strings. Default 30s.
        schedulerAutoWake:
          type: boolean
          description: When false, wake transitions must be triggered manually. Default true.
        schedulerReconcileWhileAwake:
          type: boolean
          description: When true, detects and corrects drift from failed wake executions. Default true.
        schedulerEnforceSleep:
          type: boolean
          description: When true, workloads manually scaled up during a sleep window are automatically scaled back to zero. Default true.
        protectCriticalPodNodes:
          type: boolean
          description: When true, nodes running system-node-critical or system-cluster-critical pods are never drained. Default true.
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    GuardrailsUpdate:
      description: Partial update for guardrails. Only provided fields are written.
      type: object
      properties:
        systemNamespaces:
          type: string
        skipNsNode:
          type: string
        skipNodeLabels:
          type: string
        skipNodeTaints:
          type: string
        scalingPriorityNamespaces:
          type: string
        scalingConcurrency:
          type: integer
          minimum: 1
          maximum: 50
        schedulerEvalInterval:
          type: string
        schedulerAutoWake:
          type: boolean
        schedulerReconcileWhileAwake:
          type: boolean
        schedulerEnforceSleep:
          type: boolean
        protectCriticalPodNodes:
          type: boolean

    OverviewResponse:
      description: Pre-aggregated cluster summary for the dashboard.
      type: object
      properties:
        clusterStatus:
          type: string
          enum: [awake, sleeping, partial]
        runningCount:
          type: integer
        sleepingCount:
          type: integer
        nodeCount:
          type: integer
        sleepingByNs:
          type: array
          description: Top namespaces with sleeping workloads (max 4).
          items:
            type: object
            properties:
              namespace:
                type: string
              count:
                type: integer
        nextRun:
          type: ["object", "null"]
          description: The next enabled policy event to fire. Null if no policies are enabled.
          properties:
            name:
              type: string
            nextRun:
              type: string
              format: date-time
        cacheAgeMs:
          type: integer
          description: Age of the ClusterCache snapshot in milliseconds.

    TriggerModeOverride:
      description: Optional request body for manual sleep/wake triggers to override the policy's default execution mode.
      type: object
      properties:
        mode:
          type: string
          enum: [plan, apply]
          description: Execution mode override. When omitted, the policy's configured mode is used.

    TriggerResponse:
      description: Response when a manual trigger is accepted.
      type: object
      properties:
        executionId:
          type: integer

    WorkloadResponse:
      description: A Deployment or StatefulSet with sleep status.
      type: object
      properties:
        namespace:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [Deployment, StatefulSet]
        currentReplicas:
          type: integer
        savedReplicas:
          type: ["integer", "null"]
          description: Original replica count stored in the `previous-replicas` annotation. Null if not sleeping.
        readyReplicas:
          type: integer
        status:
          type: string
          enum: [running, sleeping, partial]

    NodeResponse:
      description: A Kubernetes node enriched with pod counts, resource allocations, and guardrail protection status.
      type: object
      properties:
        name:
          type: string
        instanceType:
          type: string
        zone:
          type: string
        podCount:
          type: integer
          description: Non-DaemonSet pod count.
        status:
          type: string
          enum: [active, protected, would-drain]
        protectionReason:
          type: string
          description: Human-readable reason if status is protected. Empty otherwise.
        cpuAllocatable:
          type: integer
          format: int64
          description: Millicores.
        cpuRequested:
          type: integer
          format: int64
          description: Millicores.
        memAllocatable:
          type: integer
          format: int64
          description: Bytes.
        memRequested:
          type: integer
          format: int64
          description: Bytes.
        createdAt:
          type: string
          format: date-time
        cordoned:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
          description: Full set of Kubernetes node labels.
        taints:
          type: array
          items:
            $ref: '#/components/schemas/NodeTaintResponse'
          description: Kubernetes node taints.

    NodeTaintResponse:
      description: A Kubernetes node taint.
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
          enum: [NoSchedule, PreferNoSchedule, NoExecute]

    NodePodResponse:
      description: A pod running on a node (excludes DaemonSet pods).
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        ownerKind:
          type: string
        ownerName:
          type: string
        status:
          type: string
          description: Pod phase — Running, Pending, Failed, Succeeded, Unknown.
        readyContainers:
          type: integer
        totalContainers:
          type: integer
        cpuRequest:
          type: integer
          description: Millicores.
        memRequest:
          type: integer
          description: Bytes.
        cpuUsage:
          type: integer
          description: Millicores (0 if metrics unavailable).
        memUsage:
          type: integer
          description: Bytes (0 if metrics unavailable).
        startedAt:
          type: string
          description: RFC3339 or empty string.

    PodDetailResponse:
      description: Comprehensive pod information with containers, conditions, and events.
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
        nodeName:
          type: string
        podIP:
          type: string
        hostIP:
          type: string
        qosClass:
          type: string
        startedAt:
          type: string
          description: RFC3339 or empty string.
        nodeInstanceType:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerDetailResponse"
        conditions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              status:
                type: string
                enum: ["True", "False", "Unknown"]
        events:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [Normal, Warning]
              reason:
                type: string
              message:
                type: string
              count:
                type: integer
                format: int32
              lastSeen:
                type: string
                format: date-time

    ContainerDetailResponse:
      description: Container-level detail including resource requests, limits, and live usage.
      type: object
      properties:
        name:
          type: string
        image:
          type: string
        ready:
          type: boolean
        restartCount:
          type: integer
        cpuRequest:
          type: integer
          description: Millicores.
        memRequest:
          type: integer
          description: Bytes.
        cpuLimit:
          type: integer
          description: Millicores (0 = no limit set).
        memLimit:
          type: integer
          description: Bytes (0 = no limit set).
        cpuUsage:
          type: integer
          description: Millicores (0 = unavailable).
        memUsage:
          type: integer
          description: Bytes (0 = unavailable).
        lastState:
          type: string
          description: Terminated reason or empty string.

    ResetEvent:
      description: A progress event emitted during database reset (NDJSON stream).
      type: object
      properties:
        type:
          type: string
          enum: [step, done, error]
        message:
          type: string

    User:
      description: A user account (local or OIDC).
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        givenName:
          type: string
          description: First name (synced from OIDC given_name claim).
        familyName:
          type: string
          description: Last name (synced from OIDC family_name claim).
        email:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        source:
          type: string
          enum: [local, oidc]
          readOnly: true
        enabled:
          type: boolean
        defaultTimezone:
          type: string
          description: IANA timezone used as the default when creating new policies.
          example: Europe/Budapest
          default: UTC
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
          readOnly: true

    UserCreate:
      description: Request body for creating a local user.
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, operator, viewer]
          default: viewer
      required:
        - username
        - password

    MeResponse:
      description: Current authenticated user with computed permissions.
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        source:
          type: string
          enum: [local, oidc]
        enabled:
          type: boolean
        defaultTimezone:
          type: string
          description: IANA timezone used as the default when creating new policies.
          example: Europe/Budapest
        permissions:
          type: array
          items:
            type: string
          description: Computed from role (e.g. policy.read, user.manage).
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    UserSettingsUpdate:
      description: Request body for updating user settings.
      type: object
      properties:
        defaultTimezone:
          type: string
          description: IANA timezone (e.g. Europe/Budapest). Validated server-side.

    ClusterInfoResponse:
      description: Metadata about the connected Kubernetes cluster.
      type: object
      properties:
        apiServer:
          type: string
          description: Kubernetes API server URL.
        kubernetesVersion:
          type: string
          description: Server GitVersion (e.g. v1.30.2).
        authMode:
          type: string
          description: How the backend authenticated — "in-cluster" or "kubeconfig".
        clusterName:
          type: string
          description: Value of the CLUSTER_NAME env var. Empty when unset.

    VersionResponse:
      description: Build and runtime information.
      type: object
      properties:
        version:
          type: string
          description: Build version set via -ldflags (e.g. 0.4.2). "dev" when unset.
        goVersion:
          type: string
          description: Go runtime version (e.g. go1.26).
        uptime:
          type: string
          description: Server uptime as a Go duration string (e.g. 2h15m30s).

    LoginRequest:
      description: Local login credentials.
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      description: Successful login response.
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    ChangePasswordRequest:
      description: Password change request (local users only).
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    OIDCConfigResponse:
      description: OIDC provider configuration status.
      type: object
      properties:
        enabled:
          type: boolean
          description: True if the OIDC provider initialized successfully.
        mounted:
          type: boolean
          description: True if OIDC env vars are set (may still fail to initialize).
        issuerURL:
          type: string
        clientID:
          type: string
        redirectURL:
          type: string
        groupsClaim:
          type: string
        roleAdminGroups:
          type: array
          items:
            type: string
        roleOperatorGroups:
          type: array
          items:
            type: string

    AuditLog:
      description: An audit trail entry recording a user action.
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        userId:
          type: ["integer", "null"]
          description: Nullable — preserved after user deletion.
        username:
          type: string
          description: Denormalised for display.
        action:
          type: string
          description: "e.g. policy.update, user.create, auth.login"
        resourceType:
          type: string
        resourceId:
          type: ["integer", "null"]
        before:
          description: JSON snapshot before the change. "null" for create actions.
        after:
          description: >
            JSON snapshot after the change. "null" for delete actions.
            Auth actions carry structured context: auth.login and auth.logout
            include {"method":"local"|"oidc"}; auth.login also includes
            {"username":"..."}; auth.password_change includes
            {"method":"self-service"}.
        ipAddress:
          type: string
        timestamp:
          type: string
          format: date-time

    PaginatedAuditLogs:
      description: Paginated list of audit log entries.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
          description: Total number of matching entries across all pages.

    Error:
      description: Standard error response.
      type: object
      properties:
        error:
          type: string

    # ── Policy model ────────────────────────────────────────────────────────

    SleepWindow:
      description: A recurring sleep window defined by days of the week and a time range.
      type: object
      properties:
        name:
          type: string
          description: Optional display name for the window (e.g. "EU Maintenance").
          example: "Weekday Nights"
        daysOfWeek:
          type: array
          items:
            type: integer
          description: Days of the week (0 = Sunday, 1 = Monday, ..., 6 = Saturday).
          example: [1, 2, 3, 4, 5]
        startTime:
          type: string
          description: Start time in HH:MM format (24-hour).
          example: "20:00"
        endTime:
          type: string
          description: End time in HH:MM format (24-hour). If before startTime, spans midnight.
          example: "08:00"
        allDay:
          type: boolean
          description: When true, the entire calendar day is sleeping. startTime/endTime are ignored.
          default: false
      required:
        - daysOfWeek

    Policy:
      description: A unified sleep/wake policy that declares when workloads should be sleeping vs awake.
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1024
        namespaceFilter:
          type: string
          description: Comma-separated namespace names. Empty = all namespaces.
        labelSelector:
          type: string
          description: Standard Kubernetes label selector syntax.
        sleepWindows:
          type: ["array", "null"]
          description: Sleep windows defining when workloads should be sleeping.
          maxItems: 10
          items:
            $ref: "#/components/schemas/SleepWindow"
        timezone:
          type: string
          default: UTC
          example: Europe/Budapest
        mode:
          type: string
          enum: [plan, apply]
          description: plan = dry-run, apply = executes for real.
        enabled:
          type: boolean
        timeoutMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        currentState:
          type: string
          enum: [sleeping, awake, unknown, transitioning]
          readOnly: true
        stateSince:
          type: ["string", "null"]
          format: date-time
          readOnly: true
        lastSleepAt:
          type: ["string", "null"]
          format: date-time
          readOnly: true
        lastWakeAt:
          type: ["string", "null"]
          format: date-time
          readOnly: true
        nextTransitionAt:
          type: ["string", "null"]
          format: date-time
          readOnly: true
          description: Next predicted state transition time.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    PolicyCreate:
      description: Request body for creating a policy.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        namespaceFilter:
          type: string
        labelSelector:
          type: string
        sleepWindows:
          type: array
          description: Sleep windows defining when workloads should be sleeping.
          maxItems: 10
          items:
            $ref: "#/components/schemas/SleepWindow"
        timezone:
          type: string
          default: UTC
        mode:
          type: string
          enum: [plan, apply]
          default: plan
        enabled:
          type: boolean
          default: true
        timeoutMinutes:
          type: integer
          default: 30
      required:
        - name
        - sleepWindows

    PolicyUpdate:
      description: Partial update for a policy — only provided fields are written.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        namespaceFilter:
          type: string
        labelSelector:
          type: string
        sleepWindows:
          type: array
          description: Sleep windows — replaces all existing windows when provided.
          maxItems: 10
          items:
            $ref: "#/components/schemas/SleepWindow"
        timezone:
          type: string
        mode:
          type: string
          enum: [plan, apply]
        enabled:
          type: boolean
        timeoutMinutes:
          type: integer

    PolicyExecution:
      description: A record of a policy execution (sleep or wake run).
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        policyId:
          type: integer
        direction:
          type: string
          enum: [sleep, wake]
        mode:
          type: string
          enum: [plan, apply]
          description: plan = dry-run, apply = executes for real.
        trigger:
          type: string
          description: What caused this execution (scheduled, manual_sleep, manual_wake, recovery, etc.)
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [running, success, failed, interrupted]
        countScaled:
          type: integer
        countProtected:
          type: integer
        countDrained:
          type: integer
        countDeleted:
          type: integer
        countSkipped:
          type: integer
        countErrors:
          type: integer
        countRequests:
          type: integer
          description: Total K8s API calls made during this execution.

    PaginatedPolicyExecutions:
      description: Paginated list of policy executions.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PolicyExecution"
        total:
          type: integer

    WorkloadSnapshot:
      description: A record of a workload's replica count at the time it was scaled down.
      type: object
      properties:
        id:
          type: integer
        policyId:
          type: integer
        sleepExecutionId:
          type: integer
        wakeExecutionId:
          type: ["integer", "null"]
        namespace:
          type: string
        kind:
          type: string
          enum: [Deployment, StatefulSet]
        name:
          type: string
        replicasBefore:
          type: integer
        replicasRestored:
          type: ["integer", "null"]
        wasAlreadyZero:
          type: boolean
        restoredAt:
          type: ["string", "null"]
          format: date-time
        capturedAt:
          type: string
          format: date-time
        wasDeletedAtWake:
          type: boolean
        wasExternallyScaled:
          type: boolean

    WorkloadTarget:
      description: A specific workload targeted by a scheduled exception.
      type: object
      properties:
        kind:
          type: string
          enum: [Deployment, StatefulSet]
        namespace:
          type: string
        name:
          type: string

    ScheduledException:
      description: A one-time exception window that overrides normal scheduling (e.g. keep workloads running over a release weekend).
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        policyId:
          type: ["integer", "null"]
          description: The policy this exception applies to. Required for creation — freestanding exceptions are not supported.
        exceptionType:
          type: string
          enum: [stay_awake, force_sleep]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        ticketRef:
          type: string
          description: External ticket reference (e.g. JIRA-1234, GH#567).
        reason:
          type: string
        sleepOnEnd:
          type: boolean
          default: true
          description: When the window ends, revert to the inverse state (stay_awake → sleep, force_sleep → wake).
        namespaceFilter:
          type: string
          description: Comma-separated namespace filter. Empty = policy default.
        labelSelector:
          type: string
        status:
          type: string
          enum: [pending, active, completed, cancelled]
          readOnly: true
        startExecutionId:
          type: ["integer", "null"]
          description: Execution ID of the run that activated this exception.
        endExecutionId:
          type: ["integer", "null"]
          description: Execution ID of the run that ended this exception.
        cancelledAt:
          type: ["string", "null"]
          format: date-time
        cancelReason:
          type: string
        createdBy:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        workloadTargets:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadTarget"

    ScheduledExceptionCreate:
      description: Request body for creating a scheduled exception.
      type: object
      properties:
        policyId:
          type: integer
          description: The policy this exception applies to. Required — freestanding exceptions are not supported.
        exceptionType:
          type: string
          enum: [stay_awake, force_sleep]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        ticketRef:
          type: string
        reason:
          type: string
        sleepOnEnd:
          type: boolean
          default: true
        namespaceFilter:
          type: string
        labelSelector:
          type: string
        workloadTargets:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadTarget"
      required:
        - policyId
        - exceptionType
        - startsAt
        - endsAt

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns 200 if the server is running and the database is reachable. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Unhealthy (database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  error:
                    type: string
                    example: database unavailable

  /api/version:
    get:
      operationId: getVersion
      summary: Build and runtime info
      description: Returns the build version, Go version, and server uptime. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/overview:
    get:
      operationId: getOverview
      summary: Dashboard overview
      description: |
        Pre-aggregated cluster summary for the Overview page.
        Reads from the in-memory ClusterCache — no Kubernetes or database I/O on the hot path.
      tags: [Overview]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          description: Unauthorized

  /api/cluster/stream:
    get:
      operationId: streamCluster
      summary: SSE overview stream
      description: |
        Server-Sent Events stream. Sends the current overview immediately on connect,
        then pushes a new `data:` event on every ClusterCache refresh (~10 s cadence).
        Each event payload is a JSON-serialised `OverviewResponse`.
      tags: [Overview]
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Each `data:` line contains a JSON OverviewResponse.
        "401":
          description: Unauthorized
        "503":
          description: Cluster cache unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/workloads:
    get:
      operationId: listWorkloads
      summary: List workloads
      description: Returns all Deployments and StatefulSets with sleep status derived from the `previous-replicas` annotation.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/nodes:
    get:
      operationId: listNodes
      summary: List nodes
      description: Returns all nodes enriched with non-DaemonSet pod counts, resource requests/allocatable, and guardrail protection status.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/nodes/{name}/pods:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Kubernetes node name.
    get:
      operationId: listNodePods
      summary: List pods on a node
      description: Returns non-DaemonSet pods on the specified node. Resolves ReplicaSet owners to top-level Deployment/StatefulSet names.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodePodResponse"
        "400":
          description: Invalid node name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/pods/{namespace}/{name}:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPodDetail
      summary: Get pod detail
      description: |
        Returns comprehensive pod information: containers with resource requests/limits/usage,
        conditions, recent Kubernetes events, and live CPU/memory from the Metrics Server
        (degrades gracefully if Metrics Server is absent).
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodDetailResponse"
        "400":
          description: Invalid resource name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/pods/{namespace}/{name}/logs:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPodLogs
      summary: Stream container logs
      description: |
        Proxies the Kubernetes pod logs API. Returns plain-text log output.
        When `follow=true`, the response uses chunked transfer encoding and
        streams new log lines as the container writes them. The connection
        stays open until the client disconnects or the container terminates.
        No database involvement — logs are streamed directly from the K8s API.
      tags: [Cluster]
      parameters:
        - name: container
          in: query
          description: Container name (defaults to first container)
          schema:
            type: string
        - name: tailLines
          in: query
          description: Number of lines from the end to start from (default 500, max 10000)
          schema:
            type: integer
            default: 500
        - name: follow
          in: query
          description: Stream live logs (chunked transfer encoding)
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          description: Return logs from the previously terminated container instance
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plain-text log output (chunked when follow=true)
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid resource name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/workloads/{namespace}/{kind}/{name}/pods:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [Deployment, StatefulSet]
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listWorkloadPods
      summary: List pods for a workload
      description: Returns non-DaemonSet pods owned by the specified Deployment or StatefulSet.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodePodResponse"
        "400":
          description: Invalid resource name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/info:
    get:
      operationId: getClusterInfo
      summary: Cluster metadata
      description: Returns the Kubernetes API server URL, server version, authentication mode, and cluster name (from CLUSTER_NAME env var). Cached for 5 minutes.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterInfoResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/guardrails:
    get:
      operationId: getGuardrails
      summary: Get guardrails
      description: Returns the current guardrail configuration.
      tags: [Guardrails]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrails"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateGuardrails
      summary: Update guardrails
      description: Partial update — only provided fields are written.
      tags: [Guardrails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardrailsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrails"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/danger/reset-db:
    post:
      operationId: resetDatabase
      summary: Reset database
      description: |
        Drops all tables and reseeds defaults. Streams progress as newline-delimited JSON (NDJSON).
        Requires confirmation in the request body.

        **This operation is irreversible. All policies, executions, and log history will be deleted.**
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  enum: ["RESET DATABASE"]
              required:
                - confirm
      responses:
        "200":
          description: Streaming NDJSON progress
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ResetEvent"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "422":
          description: Missing or incorrect confirmation string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      operationId: login
      summary: Login (local)
      description: Authenticate with username and password. Sets session and CSRF cookies on success. Rate limited.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many login attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: Logout
      description: Destroys the server-side session and clears cookies.
      tags: [Auth]
      responses:
        "204":
          description: Session destroyed

  /api/auth/me:
    get:
      operationId: me
      summary: Current user
      description: Returns the authenticated user's profile and computed permissions.
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized

  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      description: Returns all active (non-expired) sessions for the authenticated user. Each session includes device info and a flag indicating which is the current session.
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Unauthorized

  /api/auth/password:
    put:
      operationId: changePassword
      summary: Change password
      description: Change the current user's password. Only available for local (non-OIDC) users.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid input (e.g. password too short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not available for SSO users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/settings:
    put:
      operationId: updateUserSettings
      summary: Update user settings
      description: Updates the current user's settings (e.g. default timezone). Returns the updated user object.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Invalid timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized

  /api/auth/oidc/config:
    get:
      operationId: oidcConfig
      summary: OIDC configuration status
      description: Returns whether OIDC is configured/enabled and the provider details. No authentication required.
      security: []
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCConfigResponse"

  /api/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Initiate OIDC login
      description: Redirects to the Keycloak authorization endpoint with PKCE challenge. Stores state and verifier in a temporary cookie.
      security: []
      tags: [Auth]
      responses:
        "302":
          description: Redirect to Keycloak
        "404":
          description: OIDC not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC callback
      description: |
        Keycloak redirects here after authentication. Exchanges the authorization code for tokens,
        validates the ID token, extracts claims (sub, preferred_username, email, given_name, family_name, groups),
        maps groups to a role, upserts the user, creates a session, and redirects to `/`.
      security: []
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to / on success
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users:
    get:
      operationId: listUsers
      summary: List users
      description: Returns all user accounts. Admin only.
      tags: [Users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
    post:
      operationId: createUser
      summary: Create user
      description: Creates a new local user account. Admin only.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateUser
      summary: Update user
      description: |
        Partial update — only provided fields are written. Admin only.
        OIDC users: role is managed by AD groups and cannot be changed here.
        Cannot change your own role or disable your own account.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, operator, viewer]
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteUser
      summary: Delete user
      description: Deletes a user account. Admin only. Cannot delete your own account.
      tags: [Users]
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete self
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/audit-logs:
    get:
      operationId: listAuditLogs
      summary: List audit logs
      description: Returns a paginated list of audit log entries, ordered by timestamp descending.
      tags: [Audit]
      parameters:
        - name: user
          in: query
          schema:
            type: string
          description: Case-insensitive partial match on username (e.g. "ali" matches "alice").
        - name: action
          in: query
          schema:
            type: string
          description: Filter by exact action (e.g. policy.update, user.create, auth.logout).
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of time range (RFC3339, e.g. 2024-01-15T00:00:00Z).
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of time range (RFC3339, e.g. 2024-01-15T23:59:59Z).
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Zero-based page index.
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
            maximum: 1000
          description: Number of items per page. Max 1000 — use a high value with page=0 to export all matching records.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditLogs"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — requires audit.view permission
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Policies ─────────────────────────────────────────────────────────────

  /api/policies:
    get:
      summary: List all policies
      tags: [Policies]
      responses:
        "200":
          description: Array of policies with computed next-run times.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
        "401":
          description: Unauthorized
    post:
      summary: Create a policy
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreate"
      responses:
        "201":
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Validation error
        "409":
          description: Overlap conflict with existing apply-mode policy

  /api/policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a policy by ID
      tags: [Policies]
      responses:
        "200":
          description: Policy details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
    put:
      summary: Update a policy (partial)
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Validation error
        "409":
          description: Overlap conflict
    delete:
      summary: Delete a policy
      tags: [Policies]
      responses:
        "204":
          description: Deleted.
        "404":
          description: Not found

  /api/policies/{id}/sleep:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Manually trigger a sleep run for the policy
      tags: [Policies]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerModeOverride"
      responses:
        "200":
          description: Execution started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "400":
          description: Invalid mode value
        "404":
          description: Not found
        "409":
          description: Already executing

  /api/policies/{id}/wake:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Manually trigger a wake run for the policy
      tags: [Policies]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerModeOverride"
      responses:
        "200":
          description: Execution started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "400":
          description: Invalid mode value
        "404":
          description: Not found
        "409":
          description: Already executing

  /api/policies/{id}/snapshots:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: open
        in: query
        schema:
          type: boolean
        description: If true, return only currently open (un-restored) snapshots.
    get:
      summary: Get workload snapshots for a policy
      tags: [Policies]
      responses:
        "200":
          description: Array of workload snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadSnapshot"

  # ── Policy executions ─────────────────────────────────────────────────────

  /api/policy-executions:
    get:
      summary: List policy executions
      tags: [Policies]
      parameters:
        - name: policy_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [running, success, failed, interrupted, skipped]
        - name: direction
          in: query
          schema:
            type: string
            enum: [sleep, wake]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: page_size
          in: query
          description: "Number of results per page. Also accepts camelCase alias: pageSize."
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated policy executions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPolicyExecutions"

  /api/policy-executions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a policy execution by ID
      tags: [Policies]
      responses:
        "200":
          description: Policy execution details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyExecution"
        "404":
          description: Not found

  /api/policy-executions/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get log lines for a policy execution
      tags: [Policies]
      responses:
        "200":
          description: Array of log lines.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogLine"

  /api/policy-executions/{id}/snapshots:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get workload snapshots for a policy execution
      tags: [Policies]
      responses:
        "200":
          description: Array of snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadSnapshot"

  /ws/policy-executions/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Stream policy execution logs via WebSocket
      tags: [Policies]
      description: |
        Upgrades to a WebSocket connection. Sends buffered log lines immediately,
        then streams new lines in real-time until the execution completes.
      responses:
        "101":
          description: WebSocket upgrade accepted.

  # ── Scheduled exceptions ──────────────────────────────────────────────────

  /api/exceptions:
    get:
      summary: List scheduled exceptions
      tags: [Exceptions]
      parameters:
        - name: policy_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed, cancelled]
      responses:
        "200":
          description: Array of scheduled exceptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledException"
    post:
      summary: Create a scheduled exception
      tags: [Exceptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledExceptionCreate"
      responses:
        "201":
          description: Exception created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledException"
        "400":
          description: Validation error

  /api/exceptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a scheduled exception by ID
      tags: [Exceptions]
      responses:
        "200":
          description: Exception details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledException"
        "404":
          description: Not found
    put:
      summary: Update a pending exception (partial)
      tags: [Exceptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledExceptionCreate"
      responses:
        "200":
          description: Updated exception.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledException"
        "409":
          description: Only pending exceptions can be edited
    delete:
      summary: Cancel a scheduled exception
      tags: [Exceptions]
      description: |
        Cancels a pending or active exception. If active and sleepOnEnd is true,
        immediately triggers a sleep run on the associated policy.
      responses:
        "204":
          description: Cancelled.
        "404":
          description: Not found

tags:
  - name: Health
    description: Server health and readiness probes.
  - name: Auth
    description: Authentication — login, logout, OIDC, password management.
  - name: Overview
    description: Pre-aggregated dashboard summary and SSE stream.
  - name: Cluster
    description: Live cluster state — workloads, nodes, and pods.
  - name: Guardrails
    description: Global guardrail configuration for namespace/node protection.
  - name: Users
    description: User account management (admin only).
  - name: Audit
    description: Audit trail of user actions.
  - name: Admin
    description: Administrative operations (danger zone).
  - name: Policies
    description: Policy-based sleep/wake management — CRUD, manual triggers, snapshots, and execution history.
  - name: Exceptions
    description: One-time scheduled exception windows that take precedence over normal policy scheduling.
