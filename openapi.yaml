openapi: "3.1.0"

info:
  title: kube-phoenix API
  description: |
    REST API for the kube-phoenix cluster sleep/wake scheduler.

    All `/api/*` and `/ws/*` endpoints require session-based authentication
    via HTTP-only cookies. `/healthz` and `/metrics` are always open.
    `/api/auth/login` and `/api/auth/oidc/*` are unauthenticated.

    Authenticate by calling `POST /api/auth/login` with username/password.
    The server sets a `__kp_session` HTTP-only cookie and a `__kp_csrf`
    cookie. Include the CSRF token as `X-CSRF-Token` header on mutations.

    WebSocket connections use cookies automatically on same-origin upgrades.
  version: "1.1.0"
  contact:
    name: kube-phoenix
    url: https://github.com/MacXsimilian/kube-phoenix
  license:
    name: Apache 2.0
    url: https://github.com/MacXsimilian/kube-phoenix/blob/master/LICENSE

externalDocs:
  description: Project documentation
  url: https://github.com/MacXsimilian/kube-phoenix#readme

servers:
  - url: /
    description: Same-origin (served by the Go binary)

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __kp_session

  schemas:
    Schedule:
      description: A cron-based sleep or wake schedule.
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: "Weekday Sleep"
        type:
          type: string
          enum: [scale_down, scale_up]
          description: Immutable after creation.
        cronExpr:
          type: string
          example: "5 19 * * 1-5"
          description: Standard 5-field cron expression.
        timezone:
          type: string
          example: "Europe/Budapest"
          description: IANA timezone name. Defaults to UTC.
        mode:
          type: string
          enum: [plan, apply]
          description: plan = dry-run, apply = executes for real.
        enabled:
          type: boolean
        namespaceFilter:
          type: string
          example: "payments,staging"
          description: Comma-separated namespace names to target. Empty = all namespaces.
        timeoutMinutes:
          type: integer
          example: 120
          description: Maximum execution duration. 0 = server default (120 min).
        position:
          type: integer
          description: Display order within the type group. Managed via the reorder endpoint.
        nextRun:
          type: ["string", "null"]
          format: date-time
          readOnly: true
          description: Next scheduled fire time. Null if disabled or schedule is invalid.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - type
        - cronExpr

    ScheduleCreate:
      description: Request body for creating a new schedule.
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [scale_down, scale_up]
        cronExpr:
          type: string
        timezone:
          type: string
          default: UTC
        mode:
          type: string
          enum: [plan, apply]
          default: plan
        enabled:
          type: boolean
          default: false
        namespaceFilter:
          type: string
          default: ""
        timeoutMinutes:
          type: integer
          default: 0
      required:
        - name
        - type
        - cronExpr

    ScheduleUpdate:
      description: Partial update — only provided fields are written. `type` is immutable and ignored.
      type: object
      properties:
        name:
          type: string
        cronExpr:
          type: string
        timezone:
          type: string
        mode:
          type: string
          enum: [plan, apply]
        enabled:
          type: boolean
        namespaceFilter:
          type: string
        timeoutMinutes:
          type: integer

    Execution:
      description: A record of a schedule execution (completed or in-progress).
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scheduleId:
          type: integer
        schedule:
          $ref: "#/components/schemas/Schedule"
          readOnly: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [running, success, failed]
        mode:
          type: string
          enum: [plan, apply]
        countScaled:
          type: integer
        countDrained:
          type: integer
        countDeleted:
          type: integer
        countSkipped:
          type: integer
        countErrors:
          type: integer
        countSaved:
          type: integer
        countProtected:
          type: integer

    LogLine:
      description: A single log entry within an execution.
      type: object
      properties:
        id:
          type: integer
        executionId:
          type: integer
        seq:
          type: integer
        level:
          type: string
          enum: [info, ok, plan, error, warn]
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    Guardrails:
      description: Global guardrail configuration that protects namespaces, nodes, and workloads from the scaler.
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        systemNamespaces:
          type: string
          example: "kube-system,kube-public,kube-node-lease,kube-phoenix"
          description: Protected system namespaces — always skipped. Comma-separated.
        skipNamespaces:
          type: string
          example: "monitoring,cert-manager"
          description: User-managed skip list. Comma-separated.
        skipNsNode:
          type: string
          example: "kube-system"
          description: Namespaces whose non-DaemonSet pods protect the node from drain. Comma-separated.
        skipNodeLabels:
          type: string
          example: "node-role.kubernetes.io/control-plane=true"
          description: Node label key=value pairs. Matching nodes are never drained. Comma-separated.
        skipNodeTaints:
          type: string
          example: "CriticalAddonsOnly=true:NoSchedule"
          description: Node taint key=value:effect entries. Matching nodes are never drained. Comma-separated.
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    GuardrailsUpdate:
      description: Partial update for guardrails. Only provided fields are written.
      type: object
      properties:
        systemNamespaces:
          type: string
        skipNamespaces:
          type: string
        skipNsNode:
          type: string
        skipNodeLabels:
          type: string
        skipNodeTaints:
          type: string

    PaginatedExecutions:
      description: Paginated list of executions.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        total:
          type: integer
          description: Total number of matching executions across all pages.

    OverviewResponse:
      description: Pre-aggregated cluster summary for the dashboard.
      type: object
      properties:
        clusterStatus:
          type: string
          enum: [awake, sleeping, partial]
        runningCount:
          type: integer
        sleepingCount:
          type: integer
        nodeCount:
          type: integer
        sleepingByNs:
          type: array
          description: Top namespaces with sleeping workloads (max 4).
          items:
            type: object
            properties:
              namespace:
                type: string
              count:
                type: integer
        nextRun:
          type: ["object", "null"]
          description: The next enabled schedule to fire. Null if no schedules are enabled.
          properties:
            name:
              type: string
            nextRun:
              type: string
              format: date-time
        cacheAgeMs:
          type: integer
          description: Age of the ClusterCache snapshot in milliseconds.

    TriggerResponse:
      description: Response when a manual trigger is accepted.
      type: object
      properties:
        executionId:
          type: integer

    WorkloadResponse:
      description: A Deployment or StatefulSet with sleep status.
      type: object
      properties:
        namespace:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [Deployment, StatefulSet]
        currentReplicas:
          type: integer
        savedReplicas:
          type: ["integer", "null"]
          description: Original replica count stored in the `previous-replicas` annotation. Null if not sleeping.
        readyReplicas:
          type: integer
        status:
          type: string
          enum: [running, sleeping, partial]

    NodeResponse:
      description: A Kubernetes node enriched with pod counts, resource allocations, and guardrail protection status.
      type: object
      properties:
        name:
          type: string
        instanceType:
          type: string
        zone:
          type: string
        podCount:
          type: integer
          description: Non-DaemonSet pod count.
        status:
          type: string
          enum: [active, protected, would-drain]
        protectionReason:
          type: string
          description: Human-readable reason if status is protected. Empty otherwise.
        cpuAllocatable:
          type: integer
          format: int64
          description: Millicores.
        cpuRequested:
          type: integer
          format: int64
          description: Millicores.
        memAllocatable:
          type: integer
          format: int64
          description: Bytes.
        memRequested:
          type: integer
          format: int64
          description: Bytes.
        createdAt:
          type: string
          format: date-time
        cordoned:
          type: boolean

    NodePodResponse:
      description: A pod running on a node (excludes DaemonSet pods).
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        ownerKind:
          type: string
        ownerName:
          type: string
        status:
          type: string
          description: Pod phase — Running, Pending, Failed, Succeeded, Unknown.
        readyContainers:
          type: integer
        totalContainers:
          type: integer
        cpuRequest:
          type: integer
          description: Millicores.
        memRequest:
          type: integer
          description: Bytes.
        cpuUsage:
          type: integer
          description: Millicores (0 if metrics unavailable).
        memUsage:
          type: integer
          description: Bytes (0 if metrics unavailable).
        startedAt:
          type: string
          description: RFC3339 or empty string.

    PodDetailResponse:
      description: Comprehensive pod information with containers, conditions, and events.
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
        nodeName:
          type: string
        podIP:
          type: string
        hostIP:
          type: string
        qosClass:
          type: string
        startedAt:
          type: string
          description: RFC3339 or empty string.
        nodeInstanceType:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerDetailResponse"
        conditions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              status:
                type: string
                enum: ["True", "False", "Unknown"]
        events:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [Normal, Warning]
              reason:
                type: string
              message:
                type: string
              count:
                type: integer
                format: int32
              lastSeen:
                type: string
                format: date-time

    ContainerDetailResponse:
      description: Container-level detail including resource requests, limits, and live usage.
      type: object
      properties:
        name:
          type: string
        image:
          type: string
        ready:
          type: boolean
        restartCount:
          type: integer
        cpuRequest:
          type: integer
          description: Millicores.
        memRequest:
          type: integer
          description: Bytes.
        cpuLimit:
          type: integer
          description: Millicores (0 = no limit set).
        memLimit:
          type: integer
          description: Bytes (0 = no limit set).
        cpuUsage:
          type: integer
          description: Millicores (0 = unavailable).
        memUsage:
          type: integer
          description: Bytes (0 = unavailable).
        lastState:
          type: string
          description: Terminated reason or empty string.

    ResetEvent:
      description: A progress event emitted during database reset (NDJSON stream).
      type: object
      properties:
        type:
          type: string
          enum: [step, done, error]
        message:
          type: string

    User:
      description: A user account (local or OIDC).
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        givenName:
          type: string
          description: First name (synced from OIDC given_name claim).
        familyName:
          type: string
          description: Last name (synced from OIDC family_name claim).
        email:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        source:
          type: string
          enum: [local, oidc]
          readOnly: true
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
          readOnly: true

    UserCreate:
      description: Request body for creating a local user.
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, operator, viewer]
          default: viewer
      required:
        - username
        - password

    MeResponse:
      description: Current authenticated user with computed permissions.
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        source:
          type: string
          enum: [local, oidc]
        enabled:
          type: boolean
        permissions:
          type: array
          items:
            type: string
          description: Computed from role (e.g. schedule.read, user.manage).
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    LoginRequest:
      description: Local login credentials.
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      description: Successful login response.
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    ChangePasswordRequest:
      description: Password change request (local users only).
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    OIDCConfigResponse:
      description: OIDC provider configuration status.
      type: object
      properties:
        enabled:
          type: boolean
          description: True if the OIDC provider initialized successfully.
        mounted:
          type: boolean
          description: True if OIDC env vars are set (may still fail to initialize).
        issuerURL:
          type: string
        clientID:
          type: string
        redirectURL:
          type: string
        groupsClaim:
          type: string
        roleAdminGroups:
          type: array
          items:
            type: string
        roleOperatorGroups:
          type: array
          items:
            type: string

    AuditLog:
      description: An audit trail entry recording a user action.
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        userId:
          type: ["integer", "null"]
          description: Nullable — preserved after user deletion.
        username:
          type: string
          description: Denormalised for display.
        action:
          type: string
          description: "e.g. schedule.update, user.create, auth.login"
        resourceType:
          type: string
        resourceId:
          type: ["integer", "null"]
        before:
          description: JSON snapshot before the change.
        after:
          description: JSON snapshot after the change.
        ipAddress:
          type: string
        timestamp:
          type: string
          format: date-time

    PaginatedAuditLogs:
      description: Paginated list of audit log entries.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
          description: Total number of matching entries across all pages.

    Error:
      description: Standard error response.
      type: object
      properties:
        error:
          type: string

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns 200 if the server is running and the database is reachable. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Unhealthy (database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  error:
                    type: string
                    example: database unavailable

  /api/schedules:
    get:
      operationId: listSchedules
      summary: List schedules
      description: Returns all schedules ordered by position. Each schedule includes a computed `nextRun` field.
      tags: [Schedules]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSchedule
      summary: Create schedule
      description: Creates a new schedule. Defaults to disabled, plan mode, UTC timezone.
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/reorder:
    put:
      operationId: reorderSchedules
      summary: Reorder schedules
      description: |
        Bulk-updates the `position` field for schedules of a given type.
        Only IDs belonging to the specified type are affected — mismatched IDs are silently ignored.
        Returns the full updated schedule list with `nextRun` fields.
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [scale_down, scale_up]
                ids:
                  type: array
                  items:
                    type: integer
                  example: [3, 1, 2]
              required:
                - type
                - ids
      responses:
        "200":
          description: Reordered — returns updated schedule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getSchedule
      summary: Get schedule
      description: Returns a single schedule by ID, including the computed `nextRun` field.
      tags: [Schedules]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid schedule ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateSchedule
      summary: Update schedule
      description: Partial update — only provided fields are written. `type` is immutable and ignored.
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSchedule
      summary: Delete schedule
      description: Deletes a schedule by ID and reloads the scheduler.
      tags: [Schedules]
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid schedule ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/executions:
    get:
      operationId: listExecutions
      summary: List executions
      description: Returns a paginated list of executions, ordered by start time descending.
      tags: [Executions]
      parameters:
        - name: schedule_id
          in: query
          schema:
            type: integer
          description: Filter by schedule ID.
        - name: status
          in: query
          schema:
            type: string
            enum: [running, success, failed]
          description: Filter by execution status.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Zero-based page index.
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of items per page (max 100).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedExecutions"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/executions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getExecution
      summary: Get execution
      description: Returns a single execution by ID with the associated schedule preloaded.
      tags: [Executions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          description: Invalid execution ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/executions/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getExecutionLogs
      summary: Get execution logs
      description: Returns all log lines for an execution ordered by sequence number. For live streaming during a running execution, use the WebSocket endpoint instead.
      tags: [Executions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogLine"
        "400":
          description: Invalid execution ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/overview:
    get:
      operationId: getOverview
      summary: Dashboard overview
      description: |
        Pre-aggregated cluster summary for the Overview page.
        Reads from the in-memory ClusterCache — no Kubernetes or database I/O on the hot path.
      tags: [Overview]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          description: Unauthorized

  /api/cluster/stream:
    get:
      operationId: streamCluster
      summary: SSE overview stream
      description: |
        Server-Sent Events stream. Sends the current overview immediately on connect,
        then pushes a new `data:` event on every ClusterCache refresh (~10 s cadence).
        Each event payload is a JSON-serialised `OverviewResponse`.
      tags: [Overview]
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Each `data:` line contains a JSON OverviewResponse.
        "401":
          description: Unauthorized
        "503":
          description: Cluster cache unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/workloads:
    get:
      operationId: listWorkloads
      summary: List workloads
      description: Returns all Deployments and StatefulSets with sleep status derived from the `previous-replicas` annotation.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/nodes:
    get:
      operationId: listNodes
      summary: List nodes
      description: Returns all nodes enriched with non-DaemonSet pod counts, resource requests/allocatable, and guardrail protection status.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeResponse"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/nodes/{name}/pods:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Kubernetes node name.
    get:
      operationId: listNodePods
      summary: List pods on a node
      description: Returns non-DaemonSet pods on the specified node. Resolves ReplicaSet owners to top-level Deployment/StatefulSet names.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodePodResponse"
        "400":
          description: Invalid node name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/pods/{namespace}/{name}:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPodDetail
      summary: Get pod detail
      description: |
        Returns comprehensive pod information: containers with resource requests/limits/usage,
        conditions, recent Kubernetes events, and live CPU/memory from the Metrics Server
        (degrades gracefully if Metrics Server is absent).
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodDetailResponse"
        "400":
          description: Invalid resource name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/pods/{namespace}/{name}/logs:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPodLogs
      summary: Stream container logs
      description: |
        Proxies the Kubernetes pod logs API. Returns plain-text log output.
        When `follow=true`, the response uses chunked transfer encoding and
        streams new log lines as the container writes them. The connection
        stays open until the client disconnects or the container terminates.
        No database involvement — logs are streamed directly from the K8s API.
      tags: [Cluster]
      parameters:
        - name: container
          in: query
          description: Container name (defaults to first container)
          schema:
            type: string
        - name: tailLines
          in: query
          description: Number of lines from the end to start from (default 500, max 10000)
          schema:
            type: integer
            default: 500
        - name: follow
          in: query
          description: Stream live logs (chunked transfer encoding)
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          description: Return logs from the previously terminated container instance
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plain-text log output (chunked when follow=true)
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid resource name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cluster/workloads/{namespace}/{kind}/{name}/pods:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [Deployment, StatefulSet]
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listWorkloadPods
      summary: List pods for a workload
      description: Returns non-DaemonSet pods owned by the specified Deployment or StatefulSet.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodePodResponse"
        "400":
          description: Invalid resource name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Kubernetes client unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/guardrails:
    get:
      operationId: getGuardrails
      summary: Get guardrails
      description: Returns the current guardrail configuration.
      tags: [Guardrails]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrails"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateGuardrails
      summary: Update guardrails
      description: Partial update — only provided fields are written.
      tags: [Guardrails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardrailsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrails"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/trigger:
    post:
      operationId: triggerSchedule
      summary: Manually trigger a schedule
      description: Runs the specified schedule immediately, outside its cron cadence. Returns the new execution ID.
      tags: [Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduleId:
                  type: integer
                mode:
                  type: string
                  enum: [plan, apply]
                  description: Overrides the schedule's configured mode for this run.
              required:
                - scheduleId
                - mode
      responses:
        "202":
          description: Accepted — execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/reset-db:
    post:
      operationId: resetDatabase
      summary: Reset database
      description: |
        Drops all tables and reseeds defaults. Streams progress as newline-delimited JSON (NDJSON).
        Requires confirmation in the request body.

        **This operation is irreversible. All schedules, executions, and log history will be deleted.**
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  enum: ["RESET DATABASE"]
              required:
                - confirm
      responses:
        "200":
          description: Streaming NDJSON progress
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ResetEvent"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "422":
          description: Missing or incorrect confirmation string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      operationId: login
      summary: Login (local)
      description: Authenticate with username and password. Sets session and CSRF cookies on success. Rate limited.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many login attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: Logout
      description: Destroys the server-side session and clears cookies.
      tags: [Auth]
      responses:
        "204":
          description: Session destroyed

  /api/auth/me:
    get:
      operationId: me
      summary: Current user
      description: Returns the authenticated user's profile and computed permissions.
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized

  /api/auth/password:
    put:
      operationId: changePassword
      summary: Change password
      description: Change the current user's password. Only available for local (non-OIDC) users.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid input (e.g. password too short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not available for SSO users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/oidc/config:
    get:
      operationId: oidcConfig
      summary: OIDC configuration status
      description: Returns whether OIDC is configured/enabled and the provider details. No authentication required.
      security: []
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCConfigResponse"

  /api/auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Initiate OIDC login
      description: Redirects to the Keycloak authorization endpoint with PKCE challenge. Stores state and verifier in a temporary cookie.
      security: []
      tags: [Auth]
      responses:
        "302":
          description: Redirect to Keycloak
        "404":
          description: OIDC not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC callback
      description: |
        Keycloak redirects here after authentication. Exchanges the authorization code for tokens,
        validates the ID token, extracts claims (sub, preferred_username, email, given_name, family_name, groups),
        maps groups to a role, upserts the user, creates a session, and redirects to `/`.
      security: []
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to / on success
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users:
    get:
      operationId: listUsers
      summary: List users
      description: Returns all user accounts. Admin only.
      tags: [Users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
    post:
      operationId: createUser
      summary: Create user
      description: Creates a new local user account. Admin only.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateUser
      summary: Update user
      description: |
        Partial update — only provided fields are written. Admin only.
        OIDC users: role is managed by AD groups and cannot be changed here.
        Cannot change your own role or disable your own account.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, operator, viewer]
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteUser
      summary: Delete user
      description: Deletes a user account. Admin only. Cannot delete your own account.
      tags: [Users]
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete self
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/audit-logs:
    get:
      operationId: listAuditLogs
      summary: List audit logs
      description: Returns a paginated list of audit log entries, ordered by timestamp descending.
      tags: [Audit]
      parameters:
        - name: user
          in: query
          schema:
            type: string
          description: Filter by username.
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action (e.g. schedule.update, user.create).
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of time range (RFC3339).
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of time range (RFC3339).
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Zero-based page index.
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
          description: Number of items per page.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditLogs"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ws/executions/{id}/logs:
    get:
      operationId: wsExecutionLogs
      summary: Live log stream (WebSocket)
      description: |
        WebSocket upgrade. Streams log lines as JSON objects in real time during an active execution.

        On connect, all previously-emitted log lines for the execution are replayed in order,
        followed by live lines as they are emitted. When the execution completes the server
        closes the connection.

        **Authentication:** Session cookie (`__kp_session`) — sent automatically by the browser on same-origin WebSocket upgrades.
      tags: [Executions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Invalid execution ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Execution not found

tags:
  - name: Health
    description: Server health and readiness probes.
  - name: Auth
    description: Authentication — login, logout, OIDC, password management.
  - name: Schedules
    description: CRUD for sleep/wake cron schedules.
  - name: Executions
    description: Execution history and log retrieval.
  - name: Overview
    description: Pre-aggregated dashboard summary and SSE stream.
  - name: Cluster
    description: Live cluster state — workloads, nodes, and pods.
  - name: Guardrails
    description: Global guardrail configuration for namespace/node protection.
  - name: Operations
    description: Manual schedule triggers.
  - name: Users
    description: User account management (admin only).
  - name: Audit
    description: Audit trail of user actions.
  - name: Admin
    description: Administrative operations (danger zone).
