# Default values for kube-phoenix.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/macxsimilian/kube-phoenix
  tag: ""   # defaults to Chart.AppVersion; override to pin a specific tag
  pullPolicy: IfNotPresent

imagePullSecrets: []   # e.g. [{name: my-registry-secret}]

replicaCount: 1
revisionHistoryLimit: 2

# Rolling update strategy. maxUnavailable: 0 ensures zero-downtime rollouts.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Namespace to deploy into. If createNamespace is true, the chart creates it.
namespaceOverride: ""   # defaults to .Release.Namespace
createNamespace: true

serviceAccount:
  create: true
  name: ""   # defaults to release-chart name
  annotations: {}   # e.g. for IRSA: eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/ROLE

# RBAC — ClusterRole + ClusterRoleBinding so the app can manage nodes cluster-wide
rbac:
  create: true

# ── Database ──────────────────────────────────────────────────────────────────
#
# By default an in-cluster PostgreSQL StatefulSet is deployed and the app is
# wired to it automatically — no DATABASE_URL configuration needed.
#
# To use an external database set postgresql.enabled=false and fill in
# externalDatabase fields (or a full url).

postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    username: kube_phoenix
    password: kube_phoenix   # IMPORTANT: change in production
    database: kube_phoenix

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""   # "" = cluster default StorageClass

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Used only when postgresql.enabled = false.
# Provide either a full DSN in `url`, or fill in the individual fields.
externalDatabase:
  url: ""   # e.g. "host=mydb.example.com user=foo password=bar dbname=kube_phoenix port=5432 sslmode=require"
  # Individual fields — used when url is empty:
  host: ""              # REQUIRED when postgresql.enabled=false
  port: 5432
  username: kube_phoenix
  password: ""
  database: kube_phoenix
  sslmode: require

# ── App secret ────────────────────────────────────────────────────────────────
#
# DATABASE_URL is auto-computed from postgresql.* or externalDatabase.* above.
# Set existingSecret to skip Secret creation and use your own (must contain
# DATABASE_URL, ADMIN_USER, ADMIN_PASSWORD).
secret:
  existingSecret: ""
  # Admin credentials — used to seed the first admin user on startup.
  # Only needed on first run (or after a database reset).
  adminUser: "admin"
  # IMPORTANT: change adminPassword before deploying to any non-local environment.
  adminPassword: "kube-phoenix"

# ── Session configuration ─────────────────────────────────────────────────────
session:
  idleTimeout: "8h"     # sliding window — extended on each request
  maxLifetime: "24h"    # absolute hard cap — session dies regardless
  cookieSecure: true    # set false for HTTP-only (dev) environments

# ── Audit log retention ───────────────────────────────────────────────────────
auditRetentionDays: 90   # auto-delete audit entries older than this (0 = keep forever)

# ── OIDC / Keycloak (optional) ────────────────────────────────────────────────
#
# Set oidc.enabled=true and fill in the fields to enable SSO login via Keycloak.
# Users authenticated via OIDC are auto-provisioned in the database.
# AD group membership controls role assignment (admin/operator/viewer).
oidc:
  enabled: false
  issuerURL: ""             # e.g. https://keycloak.example.com/realms/your-realm
  clientID: ""              # e.g. kube-phoenix
  clientSecret: ""          # client secret (leave empty if using PKCE-only public client)
  redirectURL: ""           # e.g. https://kube-phoenix.example.com/api/auth/oidc/callback
  groupsClaim: "groups"     # claim name in the ID token containing AD groups
  roleAdminGroups: ""       # comma-separated AD group names → admin role
  roleOperatorGroups: ""    # comma-separated AD group names → operator role
  # Users not matching any group default to 'viewer'.

# ── Service ───────────────────────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: ""
  tls: []
    # - secretName: kube-phoenix-tls
    #   hosts:
    #     - kube-phoenix.example.com

# ── AWS TargetGroupBinding (AWS Load Balancer Controller) ─────────────────────
#
# Use this instead of (or alongside) the Ingress when running on EKS and you
# want to attach the app to an existing ALB listener/target group.
#
# Pre-requisites:
#   1. AWS Load Balancer Controller installed in the cluster
#      https://kubernetes-sigs.github.io/aws-load-balancer-controller
#   2. An ALB + HTTPS listener already created (via Terraform, CDK, or console)
#   3. A Target Group created with:
#        - target type : ip   (routes directly to pod IPs via VPC CNI)
#        - protocol    : HTTP
#        - port        : 8080 (must match the container port)
#        - health check: HTTP  /healthz  (200 OK)
#   4. A listener rule on the ALB pointing to the target group
#      (e.g. host-header = kube-phoenix.example.com → forward to TG)
#
# The controller registers/deregisters pod IPs automatically as pods
# are created or terminated. No NodePort or LoadBalancer service needed —
# the ClusterIP service is sufficient.

targetGroupBinding:
  enabled: false
  # ARN of the pre-created AWS Target Group
  targetGroupARN: ""   # arn:aws:elasticloadbalancing:eu-central-1:ACCOUNT:targetgroup/kube-phoenix/ID
  # ip       - register pod IPs directly (requires VPC CNI, recommended for EKS)
  # instance - register node instance IDs (requires service.type: NodePort)
  targetType: ip
  # vpcID is required when targetType=ip and the controller cannot auto-detect it
  vpcID: ""   # vpc-0abc123def456

# ── App resources / probes ────────────────────────────────────────────────────

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

# startupProbe gives the app time to initialize before liveness kicks in.
# failureThreshold * periodSeconds = max startup time (30 * 5 = 150s).
startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  failureThreshold: 30
  periodSeconds: 5

terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
  # Uncomment to spread replicas across nodes when replicaCount > 1:
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels: {}   # filled in automatically by the template

priorityClassName: ""   # e.g. system-cluster-critical

# ── Network Policy ──────────────────────────────────────────────────────────
# Restricts ingress to port 8080 and egress to DNS, PostgreSQL, and the
# Kubernetes API server. Disable if your cluster does not support NetworkPolicy.
networkPolicy:
  enabled: false

# ── Pod Disruption Budget ───────────────────────────────────────────────────
# Protects against voluntary disruptions (node drains, cluster upgrades).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  maxUnavailable: 1

podAnnotations: {}
podLabels: {}

# ── Metrics (Prometheus) ──────────────────────────────────────────────────────
#
# kube-phoenix exposes Prometheus metrics at /metrics (no auth required).
#
# podAnnotations.enabled: adds standard prometheus.io/* annotations to the pod
#   so any Prometheus using annotation-based Kubernetes SD picks it up automatically.
#   Set to false if you use a ServiceMonitor instead.
#
# serviceMonitor: creates a ServiceMonitor CRD for Prometheus Operator /
#   kube-prometheus-stack users. The CRD must exist in the cluster.
#   Add labels under serviceMonitor.labels to match your Prometheus Operator's
#   serviceMonitorSelector (e.g. `release: kube-prometheus-stack`).

# Extra environment variables injected into the app container.
# Useful for LOG_LEVEL, TZ, feature flags, etc.
extraEnv: []
  # - name: LOG_LEVEL
  #   value: debug

# Extra envFrom sources (ConfigMaps or Secrets) injected into the app container.
extraEnvFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret

metrics:
  podAnnotations:
    enabled: true   # adds prometheus.io/scrape, /path, /port to the pod
  serviceMonitor:
    enabled: false
    namespace: ""         # defaults to release namespace
    interval: 30s
    scrapeTimeout: 10s
    labels: {}            # e.g. release: kube-prometheus-stack
