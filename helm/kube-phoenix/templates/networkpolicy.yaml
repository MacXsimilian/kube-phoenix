{{- if .Values.networkPolicy.enabled }}
{{- $databasePort := 5432 }}
{{- if not .Values.postgresql.enabled }}
{{- $databasePort = int .Values.externalDatabase.port }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-phoenix.fullname" . }}
  namespace: {{ include "kube-phoenix.namespace" . }}
  labels:
    {{- include "kube-phoenix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-phoenix.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from any source (Ingress controller, port-forward, etc.)
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow traffic to PostgreSQL
    - ports:
        - port: {{ $databasePort }}
          protocol: TCP
    # Allow traffic to Kubernetes API server
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgressPorts }}
    # Allow additional database, identity-provider, or Kubernetes endpoint ports
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
