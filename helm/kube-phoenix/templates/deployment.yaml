{{- include "kube-phoenix.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-phoenix.fullname" . }}
  namespace: {{ include "kube-phoenix.namespace" . }}
  labels:
    {{- include "kube-phoenix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kube-phoenix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-phoenix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.metrics.podAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kube-phoenix.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "kube-phoenix.postgresqlHost" . }} -p 5432 -U {{ .Values.postgresql.auth.username | quote }}; do
                echo "waiting for postgresql..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kube-phoenix.secretName" . }}
                  key: DATABASE_URL
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kube-phoenix.secretName" . }}
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kube-phoenix.secretName" . }}
                  key: ADMIN_PASSWORD
            - name: SESSION_IDLE_TIMEOUT
              value: {{ .Values.session.idleTimeout | quote }}
            - name: SESSION_MAX_LIFETIME
              value: {{ .Values.session.maxLifetime | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.session.cookieSecure | quote }}
            - name: AUDIT_RETENTION_DAYS
              value: {{ .Values.auditRetentionDays | quote }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kube-phoenix.secretName" . }}
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectURL | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            - name: OIDC_ROLE_ADMIN_GROUPS
              value: {{ .Values.oidc.roleAdminGroups | quote }}
            - name: OIDC_ROLE_OPERATOR_GROUPS
              value: {{ .Values.oidc.roleOperatorGroups | quote }}
            {{- if .Values.oidc.skipTLSVerify }}
            - name: OIDC_SKIP_TLS_VERIFY
              value: "true"
            {{- end }}
            {{- if and .Values.oidc.caConfigMap (not .Values.oidc.skipTLSVerify) }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/custom/{{ .Values.oidc.caCertKey | default "cacert.pem" }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.oidc.enabled .Values.oidc.caConfigMap (not .Values.oidc.skipTLSVerify) }}
            - name: oidc-ca
              mountPath: /etc/ssl/custom
              readOnly: true
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.oidc.enabled .Values.oidc.caConfigMap (not .Values.oidc.skipTLSVerify) }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.oidc.caConfigMap }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
