{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-phoenix.fullname" . }}
  labels:
    {{- include "kube-phoenix.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]

  # WARNING: 'delete' on nodes is required for cluster downscaling (removing empty
  # nodes after workloads are scaled to zero). This is a powerful permission — a
  # compromised pod with this ServiceAccount could delete any node. For hardened
  # environments, consider splitting into a read-only ClusterRole and a separate
  # mutation ClusterRole.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]

  - apiGroups: ["policy"]
    resources: ["pods/eviction"]
    verbs: ["create"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]

  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]

  # list only — needed to resolve pod owners (ReplicaSet → Deployment) in the cluster UI
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]

  # metrics.k8s.io — needed for live CPU/mem usage in node and workload pod lists
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
{{- end }}
