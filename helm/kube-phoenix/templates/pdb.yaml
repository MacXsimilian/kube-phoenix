{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kube-phoenix.fullname" . }}
  namespace: {{ include "kube-phoenix.namespace" . }}
  labels:
    {{- include "kube-phoenix.labels" . | nindent 4 }}
spec:
  {{- if hasKey .Values.podDisruptionBudget "minAvailable" }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ dig "maxUnavailable" 1 .Values.podDisruptionBudget }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kube-phoenix.serverSelectorLabels" . | nindent 6 }}
{{- end }}
