openapi: "3.1.0"

info:
  title: kube-phoenix API
  description: |
    REST API for the kube-phoenix cluster sleep/wake scheduler.

    All `/api/*` and `/ws/*` endpoints require HTTP Basic Auth when
    `BASIC_AUTH_USER` / `BASIC_AUTH_PASSWORD` are configured on the server.
    `/healthz` is always open.

    WebSocket connections (`/ws/executions/{id}/logs`) authenticate via a
    `?token=<base64(user:pass)>` query parameter.

    The SSE endpoint (`/api/cluster/stream`) uses a standard HTTP request
    with the `Authorization` header.
  version: "1.0.0"
  license:
    name: Apache 2.0
    url: https://github.com/MacXsimilian/kube-phoenix/blob/master/LICENSE

servers:
  - url: /
    description: Same-origin (served by the Go binary)

security:
  - basicAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    Schedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: "Weekday Sleep"
        type:
          type: string
          enum: [scale_down, scale_up]
          description: Immutable after creation.
        cronExpr:
          type: string
          example: "5 19 * * 1-5"
          description: Standard 5-field cron expression.
        timezone:
          type: string
          example: "Europe/Budapest"
          description: IANA timezone name. Defaults to UTC.
        mode:
          type: string
          enum: [plan, apply]
          description: plan = dry-run, apply = executes for real.
        enabled:
          type: boolean
        namespaceFilter:
          type: string
          example: "payments,staging"
          description: Comma-separated namespace names to target. Empty = all namespaces.
        timeoutMinutes:
          type: integer
          example: 120
          description: Maximum execution duration. 0 = server default (120 min).
        position:
          type: integer
          description: Display order within the type group. Managed via the reorder endpoint.
        nextRun:
          type: string
          format: date-time
          readOnly: true
          description: Next scheduled fire time. Null if disabled or schedule is invalid.
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - type
        - cronExpr

    ScheduleCreate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [scale_down, scale_up]
        cronExpr:
          type: string
        timezone:
          type: string
          default: UTC
        mode:
          type: string
          enum: [plan, apply]
          default: plan
        enabled:
          type: boolean
          default: false
        namespaceFilter:
          type: string
          default: ""
        timeoutMinutes:
          type: integer
          default: 0
      required:
        - name
        - type
        - cronExpr

    ScheduleUpdate:
      type: object
      description: All fields optional. `type` is ignored (immutable).
      properties:
        name:
          type: string
        cronExpr:
          type: string
        timezone:
          type: string
        mode:
          type: string
          enum: [plan, apply]
        enabled:
          type: boolean
        namespaceFilter:
          type: string
        timeoutMinutes:
          type: integer

    Execution:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scheduleId:
          type: integer
        schedule:
          $ref: "#/components/schemas/Schedule"
          readOnly: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, success, failed]
        mode:
          type: string
          enum: [plan, apply]
        countScaled:
          type: integer
        countDrained:
          type: integer
        countDeleted:
          type: integer
        countSkipped:
          type: integer
        countErrors:
          type: integer
        countSaved:
          type: integer
        countProtected:
          type: integer

    LogLine:
      type: object
      properties:
        id:
          type: integer
        executionId:
          type: integer
        seq:
          type: integer
        level:
          type: string
          enum: [info, ok, plan, error, warn]
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    Guardrails:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        systemNamespaces:
          type: string
          example: "kube-system,kube-public,kube-node-lease,kube-phoenix"
          description: Protected system namespaces — always skipped. Comma-separated.
        skipNamespaces:
          type: string
          example: "monitoring,cert-manager"
          description: User-managed skip list. Comma-separated.
        skipNsNode:
          type: string
          example: "kube-system"
          description: Namespaces whose non-DaemonSet pods protect the node from drain. Comma-separated.
        skipNodeLabels:
          type: string
          example: "node-role.kubernetes.io/control-plane=true"
          description: Node label key=value pairs. Matching nodes are never drained. Comma-separated.
        skipNodeTaints:
          type: string
          example: "CriticalAddonsOnly=true:NoSchedule"
          description: Node taint key=value:effect entries. Matching nodes are never drained. Comma-separated.
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    PaginatedExecutions:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    OverviewResponse:
      type: object
      properties:
        clusterStatus:
          type: string
          enum: [awake, sleeping, partial]
        runningCount:
          type: integer
        sleepingCount:
          type: integer
        nodeCount:
          type: integer
        sleepingByNs:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              count:
                type: integer
        nextRun:
          nullable: true
          type: object
          properties:
            name:
              type: string
            nextRun:
              type: string
              format: date-time
        cacheAgeMs:
          type: integer
          description: Age of the ClusterCache snapshot in milliseconds.

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns 200 if the server is running and the database is reachable. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Unhealthy (database unreachable)

  /api/schedules:
    get:
      summary: List schedules
      description: Returns all schedules ordered by type and position. Each schedule includes a `nextRun` field.
      tags: [Schedules]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      summary: Create schedule
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/reorder:
    put:
      summary: Reorder schedules
      description: |
        Bulk-updates the `position` field for schedules of a given type.
        Only IDs belonging to the specified type are affected — mismatched IDs are silently ignored.
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [scale_down, scale_up]
                ids:
                  type: array
                  items:
                    type: integer
                  example: [3, 1, 2]
              required:
                - type
                - ids
      responses:
        "200":
          description: Reordered — returns updated schedule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"

  /api/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get schedule
      tags: [Schedules]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
    put:
      summary: Update schedule
      description: Partial update — only provided fields are written. `type` is ignored.
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
    delete:
      summary: Delete schedule
      tags: [Schedules]
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /api/executions:
    get:
      summary: List executions
      tags: [Executions]
      parameters:
        - name: schedule_id
          in: query
          schema:
            type: integer
          description: Filter by schedule ID
        - name: status
          in: query
          schema:
            type: string
            enum: [running, success, failed]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedExecutions"

  /api/executions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get execution
      tags: [Executions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "404":
          description: Not found

  /api/executions/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get execution logs
      description: Returns all log lines for a completed execution ordered by seq ASC. For a running execution use the WebSocket endpoint instead.
      tags: [Executions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogLine"

  /api/overview:
    get:
      summary: Dashboard overview
      description: |
        Pre-aggregated cluster summary for the Overview page.
        Reads from the in-memory ClusterCache — no Kubernetes or database I/O on the hot path.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"

  /api/cluster/stream:
    get:
      summary: SSE overview stream
      description: |
        Server-Sent Events stream. Sends the current overview immediately on connect,
        then pushes a new `data:` event on every ClusterCache refresh (~10 s cadence).
        Each event payload is a JSON-serialised `OverviewResponse`.
      tags: [Cluster]
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/cluster/workloads:
    get:
      summary: List workloads
      description: Returns all Deployments and StatefulSets with sleep status derived from the `previous-replicas` annotation.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/cluster/nodes:
    get:
      summary: List nodes
      description: Returns all nodes enriched with pod counts, resource requests, and guardrail protection status.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/cluster/nodes/{name}/pods:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List pods on a node
      description: Returns non-DaemonSet pods on the specified node. Resolves ReplicaSet → Deployment owner chains for a human-readable workload name.
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/cluster/pods/{namespace}/{name}:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get pod detail
      description: |
        Returns comprehensive pod information: containers, conditions, recent events,
        and live CPU/memory usage from the Metrics Server (degrades gracefully if absent).
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Pod not found

  /api/cluster/workloads/{namespace}/{kind}/{name}/pods:
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [Deployment, StatefulSet]
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List pods for a workload
      tags: [Cluster]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/guardrails:
    get:
      summary: Get guardrails
      tags: [Guardrails]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrails"
    put:
      summary: Update guardrails
      tags: [Guardrails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Guardrails"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guardrails"

  /api/trigger:
    post:
      summary: Manually trigger a schedule
      description: Runs the specified schedule immediately, outside its cron cadence.
      tags: [Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduleId:
                  type: integer
                mode:
                  type: string
                  enum: [plan, apply]
                  description: Overrides the schedule's configured mode for this run.
              required:
                - scheduleId
                - mode
      responses:
        "202":
          description: Accepted — execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "404":
          description: Schedule not found
        "409":
          description: Schedule is already running

  /api/admin/reset-db:
    post:
      summary: Reset database
      description: |
        Drops all tables and reseeds defaults. Streams progress as newline-delimited JSON (NDJSON).
        Requires confirmation in the request body.

        **This operation is irreversible. All schedules, executions, and log history will be deleted.**
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  enum: ["RESET DATABASE"]
              required:
                - confirm
      responses:
        "200":
          description: Streaming NDJSON progress
          content:
            application/x-ndjson:
              schema:
                type: string
        "400":
          description: Missing or incorrect confirmation string

  /ws/executions/{id}/logs:
    get:
      summary: Live log stream (WebSocket)
      description: |
        WebSocket upgrade. Streams log lines as JSON objects in real time during an active execution.

        On connect, all previously-emitted log lines for the execution are replayed in order,
        followed by live lines as they are emitted. When the execution completes, the server
        sends a final `{"done": true}` message and closes the connection.

        **Authentication:** `?token=<base64(user:pass)>` query parameter (browsers cannot
        set `Authorization` headers on WebSocket upgrades).
      tags: [Executions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: base64(user:pass) — required when Basic Auth is enabled on the server.
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Unauthorized

tags:
  - name: Health
  - name: Schedules
  - name: Executions
  - name: Cluster
  - name: Guardrails
  - name: Operations
  - name: Admin
