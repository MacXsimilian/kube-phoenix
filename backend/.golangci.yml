version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # suspicious constructs
    - staticcheck    # broad static analysis
    - unused         # unexported declarations never used
    - ineffassign    # assignments whose values are never used
    - bodyclose      # HTTP response bodies not closed
    - noctx          # HTTP requests without context
    - sqlclosecheck  # sql.Rows / sql.Stmt not closed
    - gosec          # security checks
  settings:
    errcheck:
      # Ignore errors from common write operations where callers rarely handle them.
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*github.com/gorilla/websocket.Conn).WriteMessage
    gosec:
      excludes:
        - G104  # unhandled errors (already caught by errcheck)
        - G706  # log injection false positive — slog key-value structured logging is safe
        - G124  # cookie security false positive — Secure is config-driven via h.cookieSecure (defaults true); CSRF cookie is intentionally JS-readable
