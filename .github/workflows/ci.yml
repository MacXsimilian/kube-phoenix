name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend regression checks
        run: |
          npm run test:windows
          node --test tests/observability-history.test.mjs
          node --test mock-api/tests/exceptions.test.mjs

      - name: Build
        id: fe_build
        run: |
          START=$(date +%s)
          npm run build
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Bundle size analysis
        id: fe_bundle
        run: |
          TOTAL_BYTES=$(du -sb out/ 2>/dev/null | cut -f1 || echo 0)
          TOTAL_HUMAN=$(du -sh out/ 2>/dev/null | cut -f1 || echo 'N/A')
          JS_BYTES=$(find out/ -name '*.js' -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1 || echo 0)
          CSS_BYTES=$(find out/ -name '*.css' -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1 || echo 0)
          HTML_BYTES=$(find out/ -name '*.html' -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1 || echo 0)

          JS_HUMAN=$(numfmt --to=iec "${JS_BYTES:-0}" 2>/dev/null || echo 'N/A')
          CSS_HUMAN=$(numfmt --to=iec "${CSS_BYTES:-0}" 2>/dev/null || echo 'N/A')
          HTML_HUMAN=$(numfmt --to=iec "${HTML_BYTES:-0}" 2>/dev/null || echo 'N/A')

          BUDGET_BYTES=$((5 * 1024 * 1024))
          if [ "${TOTAL_BYTES}" -gt "${BUDGET_BYTES}" ] 2>/dev/null; then
            STATUS="⚠️ Over 5 MB budget"
          else
            STATUS="✅ Within 5 MB budget"
          fi

          {
            echo "status=${STATUS}"
            echo "total=${TOTAL_HUMAN}"
            echo "js=${JS_HUMAN}"
            echo "css=${CSS_HUMAN}"
            echo "html=${HTML_HUMAN}"
          } >> "$GITHUB_OUTPUT"

      - name: Frontend summary
        if: always()
        run: |
          PAGES=$(find out/ -name '*.html' -not -name '404.html' 2>/dev/null | wc -l | tr -d ' ')

          {
            echo "## Frontend Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Node | $(node -v) |"
            echo "| Build duration | ${{ steps.fe_build.outputs.duration }}s |"
            echo "| Static pages | ${PAGES} |"
            echo "| Export size | ${{ steps.fe_bundle.outputs.total }} |"
            echo "| JavaScript | ${{ steps.fe_bundle.outputs.js }} |"
            echo "| CSS | ${{ steps.fe_bundle.outputs.css }} |"
            echo "| HTML | ${{ steps.fe_bundle.outputs.html }} |"
            echo "| Size budget | ${{ steps.fe_bundle.outputs.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend build, vet, test & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Ownership and migration tests need a real, disposable PostgreSQL database.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kube_phoenix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kube_phoenix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: Assert embedded spec matches root openapi.yaml
        run: diff ../openapi.yaml internal/docs/openapi.yaml

      - run: go mod download
      - run: go vet ./...

      - name: golangci-lint
        id: be_lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

      - name: Test
        id: be_test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kube_phoenix_test?sslmode=disable
        run: |
          # Missing integration configuration must fail CI instead of skipping tests.
          : "${TEST_DATABASE_URL:?TEST_DATABASE_URL is required for CI database tests}"
          START=$(date +%s)
          TEST_EXIT=0
          go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee /tmp/test.out || TEST_EXIT=$?
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          PASSED=$(grep -c '^ok' /tmp/test.out || true)
          FAILED=$(grep -c '^FAIL' /tmp/test.out || true)
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          exit "$TEST_EXIT"

      - name: Coverage
        id: be_cov
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          go tool cover -func=coverage.out

      - name: Backend summary
        if: always()
        run: |
          PASSED="${{ steps.be_test.outputs.passed }}"
          FAILED="${{ steps.be_test.outputs.failed }}"
          TEST_OUTCOME="${{ steps.be_test.outcome }}"
          if [ "$TEST_OUTCOME" = "failure" ]; then
            TEST_STATUS="🔴 ${PASSED} passed, ${FAILED} failed"
            RACE_STATUS="🔴 Test step failed (-race enabled)"
          elif [ "$TEST_OUTCOME" = "success" ]; then
            TEST_STATUS="✅ ${PASSED} passed"
            RACE_STATUS="✅ Passed with -race"
          else
            TEST_STATUS="🟡 ${TEST_OUTCOME}"
            RACE_STATUS="🟡 Not run"
          fi

          LINT_STATUS="${{ steps.be_lint.outcome }}"
          if [ "$LINT_STATUS" = "success" ]; then
            LINT="✅ Clean"
          else
            LINT="🟡 Warnings found"
          fi

          {
            echo "## Backend Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Tests | ${TEST_STATUS} |"
            echo "| Test duration | ${{ steps.be_test.outputs.duration }}s |"
            echo "| Coverage | ${{ steps.be_cov.outputs.total }} |"
            echo "| Race detector | ${RACE_STATUS} |"
            echo "| Lint | ${LINT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Helm lint ───────────────────────────────────────────────────────────────
  helm:
    name: Helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: "4.3.0"

      - run: helm lint helm/kube-phoenix

      - name: Test PostgreSQL storage and upgrade guards
        run: python3 -B -m unittest discover -s hack/tests -p 'test_*.py' -v

      - name: Lint with example values
        run: |
          for f in examples/values-*.yaml; do
            echo "--- helm lint -f $f ---"
            helm lint helm/kube-phoenix -f "$f"
          done

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.8.0"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate rendered manifests with kubeconform
        run: |
          echo "--- helm template (default values) | kubeconform ---"
          helm template helm/kube-phoenix \
            | kubeconform -strict -summary -schema-location default -ignore-missing-schemas
          for f in examples/values-*.yaml; do
            echo "--- helm template -f $f | kubeconform ---"
            extra=()
            case "$f" in
              *values-alb.yaml)
                extra=(--set "targetGroupBinding.targetGroupARN=arn:aws:elasticloadbalancing:us-east-1:000000000000:targetgroup/ci-validation/0123456789abcdef")
                ;;
            esac
            helm template helm/kube-phoenix -f "$f" "${extra[@]}" \
              | kubeconform -strict -summary -schema-location default -ignore-missing-schemas
          done

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018  # apk add --no-cache not needed in our alpine stages

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: false
          build-args: |
            NEXT_PUBLIC_APP_VERSION=ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max


