name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        id: fe_build
        run: |
          START=$(date +%s)
          npm run build
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Bundle size analysis
        id: fe_bundle
        run: |
          TOTAL_BYTES=$(du -sb out/ 2>/dev/null | cut -f1 || echo 0)
          TOTAL_HUMAN=$(du -sh out/ 2>/dev/null | cut -f1 || echo 'N/A')
          JS_BYTES=$(find out/ -name '*.js' -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1 || echo 0)
          CSS_BYTES=$(find out/ -name '*.css' -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1 || echo 0)
          HTML_BYTES=$(find out/ -name '*.html' -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1 || echo 0)

          JS_HUMAN=$(numfmt --to=iec "${JS_BYTES:-0}" 2>/dev/null || echo 'N/A')
          CSS_HUMAN=$(numfmt --to=iec "${CSS_BYTES:-0}" 2>/dev/null || echo 'N/A')
          HTML_HUMAN=$(numfmt --to=iec "${HTML_BYTES:-0}" 2>/dev/null || echo 'N/A')

          BUDGET_BYTES=$((5 * 1024 * 1024))
          if [ "${TOTAL_BYTES}" -gt "${BUDGET_BYTES}" ] 2>/dev/null; then
            echo "status=⚠️ Over 5 MB budget" >> "$GITHUB_OUTPUT"
          else
            echo "status=✅ Within 5 MB budget" >> "$GITHUB_OUTPUT"
          fi

          echo "total=${TOTAL_HUMAN}" >> "$GITHUB_OUTPUT"
          echo "js=${JS_HUMAN}" >> "$GITHUB_OUTPUT"
          echo "css=${CSS_HUMAN}" >> "$GITHUB_OUTPUT"
          echo "html=${HTML_HUMAN}" >> "$GITHUB_OUTPUT"

      - name: Frontend summary
        if: always()
        run: |
          PAGES=$(find out/ -name '*.html' -not -name '404.html' 2>/dev/null | wc -l | tr -d ' ')

          {
            echo "## Frontend Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Node | $(node -v) |"
            echo "| Build duration | ${{ steps.fe_build.outputs.duration }}s |"
            echo "| Static pages | ${PAGES} |"
            echo "| Export size | ${{ steps.fe_bundle.outputs.total }} |"
            echo "| JavaScript | ${{ steps.fe_bundle.outputs.js }} |"
            echo "| CSS | ${{ steps.fe_bundle.outputs.css }} |"
            echo "| HTML | ${{ steps.fe_bundle.outputs.html }} |"
            echo "| Size budget | ${{ steps.fe_bundle.outputs.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend build, vet, test & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: Assert embedded spec matches root openapi.yaml
        run: diff ../openapi.yaml internal/docs/openapi.yaml

      - run: go mod download
      - run: go vet ./...

      - name: golangci-lint
        id: be_lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
        with:
          version: v2.12.2
          working-directory: backend

      - name: Test
        id: be_test
        run: |
          START=$(date +%s)
          go test -race -coverprofile=coverage.out ./... 2>&1 | tee /tmp/test.out
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          PASSED=$(grep -c '^ok' /tmp/test.out || true)
          FAILED=$(grep -c '^FAIL' /tmp/test.out || true)
          echo "passed=${PASSED:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"

      - name: Coverage
        id: be_cov
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          go tool cover -func=coverage.out

      - name: Backend summary
        if: always()
        run: |
          PASSED="${{ steps.be_test.outputs.passed }}"
          FAILED="${{ steps.be_test.outputs.failed }}"
          if [ "${FAILED}" -gt 0 ] 2>/dev/null; then
            TEST_STATUS="🔴 ${PASSED} passed, ${FAILED} failed"
          else
            TEST_STATUS="✅ ${PASSED} passed"
          fi

          LINT_STATUS="${{ steps.be_lint.outcome }}"
          if [ "$LINT_STATUS" = "success" ]; then
            LINT="✅ Clean"
          else
            LINT="🟡 Warnings found"
          fi

          {
            echo "## Backend Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Tests | ${TEST_STATUS} |"
            echo "| Test duration | ${{ steps.be_test.outputs.duration }}s |"
            echo "| Coverage | ${{ steps.be_cov.outputs.total }} |"
            echo "| Race detector | ✅ Clean (-race enabled) |"
            echo "| Lint | ${LINT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Helm lint ───────────────────────────────────────────────────────────────
  helm:
    name: Helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5.0.0
        with:
          version: "4.2.0"

      - run: helm lint helm/kube-phoenix

      - name: Lint with example values
        run: |
          for f in examples/values-*.yaml; do
            echo "--- helm lint -f $f ---"
            helm lint helm/kube-phoenix -f "$f"
          done

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018  # apk add --no-cache not needed in our alpine stages

      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: false
          build-args: |
            NEXT_PUBLIC_APP_VERSION=ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max


