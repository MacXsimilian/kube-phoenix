name: CI

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "openapi.yaml"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "openapi.yaml"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend build, vet, test & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: Assert embedded spec matches root openapi.yaml
        run: diff ../openapi.yaml internal/docs/openapi.yaml

      - run: go mod download
      - run: go vet ./...
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: v2.11.3
          working-directory: backend

  # ── Helm lint ───────────────────────────────────────────────────────────────
  helm:
    name: Helm lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: "4.1.3"

      - run: helm lint helm/kube-phoenix

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018  # apk add --no-cache not needed in our alpine stages

      - name: Build image (no push)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: false
          build-args: |
            NEXT_PUBLIC_APP_VERSION=ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Go Report Card refresh ───────────────────────────────────────────────────
  goreportcard:
    name: Refresh Go Report Card
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend]
    permissions:
      contents: read
    steps:
      - name: Trigger rescan
        run: |
          curl -s -X POST https://goreportcard.com/checks \
            -d "repo=github.com/macxsimilian/kube-phoenix/backend"

