name: CI

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default grants packages: write so the reusable docker-build workflow can push.
# Jobs that don't need it override with an explicit permissions block.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-phoenix
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - run: npm install
      - run: npm run build

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend build, vet, test & lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7.0.1
        with:
          version: v2.9.0
          working-directory: backend

  # ── Helm lint ───────────────────────────────────────────────────────────────
  helm:
    name: Helm lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: "3.16.3"

      - run: helm lint helm/kube-phoenix

  # ── Docker build — amd64 ────────────────────────────────────────────────────
  docker-amd64:
    name: Docker build & push (amd64)
    needs: [frontend, backend]
    uses: ./.github/workflows/_docker-build.yml
    with:
      arch: amd64
      image: ghcr.io/${{ github.repository_owner }}/kube-phoenix
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  # ── Docker build — arm64 (disabled — re-enable when needed) ─────────────────
  # docker-arm64:
  #   name: Docker build & push (arm64)
  #   needs: [frontend, backend]
  #   uses: ./.github/workflows/_docker-build.yml
  #   with:
  #     arch: arm64
  #     image: ghcr.io/${{ github.repository_owner }}/kube-phoenix
  #     push: ${{ github.event_name == 'push' }}
  #   secrets: inherit

  # ── Docker merge manifest ────────────────────────────────────────────────────
  docker-merge:
    name: Docker merge manifest
    runs-on: ubuntu-24.04
    needs: [docker-amd64]
    # needs: [docker-amd64, docker-arm64]  # uncomment when arm64 is re-enabled
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker buildx imagetools create \
            --tag ${IMAGE}:${SHA} \
            --tag ${IMAGE}:latest \
            ${IMAGE}:${SHA}-amd64
            # ${IMAGE}:${SHA}-arm64  # uncomment when arm64 is re-enabled

  # ── Trivy image scan ─────────────────────────────────────────────────────────
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    needs: [docker-merge]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image ref
        id: image
        run: echo "ref=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_OUTPUT

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ── Helm package & push ───────────────────────────────────────────────────────
  helm-publish:
    name: Helm package & push
    runs-on: ubuntu-24.04
    needs: [helm, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: "3.16.3"

      - name: Log in to GHCR (OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package helm/kube-phoenix --destination /tmp/chart

      - name: Push chart to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push /tmp/chart/kube-phoenix-*.tgz oci://ghcr.io/${OWNER}/helm
