# Release Please — manages release PRs and creates GitHub Releases with tags.
#
# On every push to master:
#   1. Creates/updates a release PR with changelog based on Conventional Commits
#   2. When the release PR is merged, creates a GitHub Release + git tag
#
# This workflow ONLY handles versioning and tagging. The actual build/publish
# is triggered by the separate release.yml workflow via the `release: published` event.
# This decoupling ensures the tag always exists even if the build fails.

name: Release Please

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38  # v4.4.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}

  # ── Go Report Card refresh (runs on every merge to master) ──────────────────
  goreportcard:
    name: Refresh Go Report Card
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Trigger rescan
        run: |
          curl -s -X POST https://goreportcard.com/checks \
            -d "repo=github.com/macxsimilian/kube-phoenix/backend"
