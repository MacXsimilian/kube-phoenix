# Release Please — manages release PRs and creates GitHub Releases with tags.
#
# On every push to master:
#   1. Creates/updates a release PR with changelog based on Conventional Commits
#   2. When the release PR is merged, creates a GitHub Release + git tag
#
# This workflow handles versioning/tagging AND chains the release build.
# The build is triggered via `workflow_call` because `release: published` events
# created by GITHUB_TOKEN do not trigger other workflows.
# The decoupled release.yml can still be manually re-triggered via `workflow_dispatch`.

name: Release Please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}

  # ── Trigger release build when a new release is created ─────────────────────
  release-build:
    name: Trigger release build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write

  # ── Go Report Card refresh (runs on every merge to master) ──────────────────
  goreportcard:
    name: Refresh Go Report Card
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Trigger rescan
        run: |
          curl -fsS -X POST https://goreportcard.com/checks \
            -d "repo=github.com/macxsimilian/kube-phoenix/backend"
