# Release Build — builds, signs, and publishes Docker image + Helm chart.
#
# Triggered by:
#   - `workflow_call` from release-please.yml after creating a GitHub Release
#   - `workflow_dispatch` with a tag input (for manual re-runs after a failed build)
#
# NOTE: We cannot rely on `release: published` because release-please creates
# the release using GITHUB_TOKEN, and GitHub Actions does not trigger other
# workflows from events created by GITHUB_TOKEN.
#
# This is decoupled from release-please.yml so that:
#   1. The git tag always exists even if the build fails
#   2. Failed builds can be re-triggered without re-running release-please
#   3. The release PR merge is never blocked by build infrastructure issues

name: Release Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.5.10)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.5.10)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # ── Docker build, sign, and push ────────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-image-publishing-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing via OIDC
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
      - name: Check out release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp .github/scripts/release_images.py "$RUNNER_TEMP/release_images.py"
          cp .github/scripts/smoke_image.py "$RUNNER_TEMP/smoke_image.py"
          python3 "$RUNNER_TEMP/release_images.py" validate "$RELEASE_TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Validate release commit
        id: source
        env:
          RELEASE_REF: ${{ steps.tag.outputs.ref }}
        run: |
          REVISION=$(git rev-parse "${RELEASE_REF}^{commit}")
          if [ "$REVISION" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked-out source does not match the release tag"
            exit 1
          fi
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kube-phoenix" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Resolve published release image
        id: existing
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: python3 "$RUNNER_TEMP/release_images.py" resolve "$IMAGE" "$VERSION" "$REVISION"

      # Register cache restore before cache-dance so post steps extract before saving.
      - name: Restore BuildKit cache mounts
        id: mount-cache
        if: steps.existing.outputs.exists == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-mounts
          key: buildkit-mounts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'frontend/package-lock.json', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            buildkit-mounts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'frontend/package-lock.json', 'backend/go.sum') }}-

      - name: Inject BuildKit cache mounts
        if: steps.existing.outputs.exists == 'false'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit == 'true' }}
          cache-map: |
            {
              "${{ runner.temp }}/buildkit-mounts/npm": "/root/.npm",
              "${{ runner.temp }}/buildkit-mounts/next": "/app/frontend/.next/cache",
              "${{ runner.temp }}/buildkit-mounts/go-mod": "/go/pkg/mod",
              "${{ runner.temp }}/buildkit-mounts/go-build": "/root/.cache/go-build"
            }

      - name: Build & push
        id: build
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: true
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release image identity
        id: artifact
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
          REVISION: ${{ steps.source.outputs.revision }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          flags=()
          if [ -n "$EXISTING_DIGEST" ]; then
            DIGEST="$EXISTING_DIGEST"
            flags=(--allow-legacy)
          else
            DIGEST="$BUILD_DIGEST"
          fi
          python3 "$RUNNER_TEMP/release_images.py" verify "$IMAGE" "$VERSION" "$REVISION" "$DIGEST" "${flags[@]}"

      - name: Smoke test final image
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.artifact.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          docker pull "$IMAGE_REF"
          python3 "$RUNNER_TEMP/smoke_image.py" "$IMAGE_REF" "$EXPECTED_VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign image (keyless)
        run: |
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.artifact.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: "${{ steps.image.outputs.name }}@${{ steps.artifact.outputs.digest }}"
          artifact-name: sbom-kube-phoenix.spdx.json
          output-file: sbom-kube-phoenix.spdx.json

      - name: Attest SBOM to image
        run: |
          cosign attest --yes --predicate sbom-kube-phoenix.spdx.json --type spdxjson "${{ steps.image.outputs.name }}@${{ steps.artifact.outputs.digest }}"

      - name: Promote stable image aliases
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
        run: python3 "$RUNNER_TEMP/release_images.py" promote "$IMAGE" "$VERSION" "$DIGEST"

  # ── Helm chart package & push ───────────────────────────────────────────────
  helm-publish:
    name: Helm chart publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: docker
    if: ${{ needs.docker.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: "4.3.0"

      - name: Log in to GHCR (OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          helm package helm/kube-phoenix \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination /tmp/chart

      - name: Push chart to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push /tmp/chart/kube-phoenix-*.tgz "oci://ghcr.io/${OWNER}/helm"

  # ── Sign and attach release artifacts ──────────────────────────────────────
  release-assets:
    name: Sign & attach release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker, helm-publish]
    if: ${{ needs.docker.result == 'success' }}
    permissions:
      contents: write
      id-token: write
    outputs:
      artifacts-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Generate checksums
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          IMAGE="${{ needs.docker.outputs.image }}"
          DIGEST="${{ needs.docker.outputs.digest }}"

          {
            echo "# kube-phoenix ${TAG} checksums"
            echo "# Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Container Image"
            echo "image: ${IMAGE}:${VERSION}"
            echo "digest: ${DIGEST}"
          } > checksums.txt

          sha256sum checksums.txt > SHA256SUMS

      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.cert \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS

      - name: Compute artifact hash for SLSA provenance
        id: hash
        run: |
          echo "sha256=$(sha256sum SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" SHA256SUMS SHA256SUMS.sig SHA256SUMS.cert SHA256SUMS.bundle checksums.txt --clobber

  # ── SLSA provenance ────────────────────────────────────────────────────────
  provenance:
    name: SLSA provenance
    needs: release-assets
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: ${{ needs.release-assets.outputs.artifacts-sha256 }}
      provenance-name: SHA256SUMS.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ inputs.tag }}
      private-repository: true
      compile-generator: true
