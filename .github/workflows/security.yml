name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Go vulnerability check ──────────────────────────────────────────────────
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Copy OpenAPI spec into embed path
        run: cp openapi.yaml backend/internal/docs/openapi.yaml

      - name: govulncheck
        id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26"
          work-dir: backend
          output-format: sarif
          output-file: govulncheck.sarif
          repo-checkout: false

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: govulncheck.sarif

      - name: govulncheck summary
        if: always()
        run: |
          RESULT="${{ steps.govulncheck.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ Scan completed (results uploaded to Security tab)"
          else
            STATUS="🔴 Scan failed"
          fi

          {
            echo "## Go Vulnerability Check"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scanner | govulncheck (call-graph analysis) |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── npm audit ───────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit
        id: npm_audit
        run: |
          AUDIT=$(npm audit --omit=dev 2>&1) && STATUS="clean" || STATUS="found"
          echo "$AUDIT"
          HIGH=$(echo "$AUDIT" | grep -oP '\d+ high' | grep -oP '\d+' || echo 0)
          CRITICAL=$(echo "$AUDIT" | grep -oP '\d+ critical' | grep -oP '\d+' || echo 0)
          MODERATE=$(echo "$AUDIT" | grep -oP '\d+ moderate' | grep -oP '\d+' || echo 0)
          {
            echo "high=${HIGH}"
            echo "critical=${CRITICAL}"
            echo "moderate=${MODERATE}"
            echo "status=${STATUS}"
          } >> "$GITHUB_OUTPUT"
          # Fail only on high+
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then exit 1; fi

      - name: npm audit summary
        if: always()
        run: |
          CRIT="${{ steps.npm_audit.outputs.critical }}"
          HIGH="${{ steps.npm_audit.outputs.high }}"
          MOD="${{ steps.npm_audit.outputs.moderate }}"

          if [ "$CRIT" -gt 0 ] 2>/dev/null; then
            RESULT="🔴 ${CRIT} critical, ${HIGH} high, ${MOD} moderate"
          elif [ "$HIGH" -gt 0 ] 2>/dev/null; then
            RESULT="🟡 ${HIGH} high, ${MOD} moderate"
          elif [ "$MOD" -gt 0 ] 2>/dev/null; then
            RESULT="🟢 ${MOD} moderate (no high/critical)"
          else
            RESULT="✅ No known vulnerabilities"
          fi

          {
            echo "## npm Audit"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Node | $(node -v) |"
            echo "| Scope | production dependencies only |"
            echo "| Critical | ${CRIT} |"
            echo "| High | ${HIGH} |"
            echo "| Moderate | ${MOD} |"
            echo "| Result | ${RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy container image scan ──────────────────────────────────────────────
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: kube-phoenix:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image vuln scan
        id: trivy_image_vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-phoenix:scan
          scanners: vuln
          format: sarif
          output: trivy-image-vuln.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image misconfig scan
        id: trivy_image_misconfig
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-phoenix:scan
          scanners: misconfig
          format: sarif
          output: trivy-image-misconfig.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivy-config: .github/trivy.yaml
          trivyignores: .trivyignore

      - name: Upload vuln SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: trivy-image-vuln.sarif
          category: trivy-image-vuln

      - name: Upload misconfig SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: trivy-image-misconfig.sarif
          category: trivy-image-misconfig

      - name: Trivy image summary
        if: always()
        run: |
          VULN="${{ steps.trivy_image_vuln.outcome }}"
          if [ "$VULN" = "success" ]; then
            VULN_STATUS="✅ No critical/high vulnerabilities"
          else
            VULN_STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Container Image Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Image | kube-phoenix:scan |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Vulnerabilities (gating) | ${VULN_STATUS} |"
            echo "| Misconfigurations (informational) | SARIF uploaded to Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy filesystem scan (IaC + deps) ─────────────────────────────────────
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy filesystem vuln scan
        id: trivy_fs_vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs-vuln.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy filesystem misconfig scan
        id: trivy_fs_misconfig
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: sarif
          output: trivy-fs-misconfig.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivy-config: .github/trivy.yaml
          trivyignores: .trivyignore

      - name: Upload vuln SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: trivy-fs-vuln.sarif
          category: trivy-fs-vuln

      - name: Upload misconfig SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: trivy-fs-misconfig.sarif
          category: trivy-fs-misconfig

      - name: Trivy filesystem summary
        if: always()
        run: |
          VULN="${{ steps.trivy_fs_vuln.outcome }}"
          if [ "$VULN" = "success" ]; then
            VULN_STATUS="✅ No critical/high vulnerabilities"
          else
            VULN_STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Filesystem Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scope | IaC + dependencies |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Vulnerabilities (gating) | ${VULN_STATUS} |"
            echo "| Misconfigurations (informational) | SARIF uploaded to Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Go static security analysis ─────────────────────────────────────────────
  gosec:
    name: Go static security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: gosec
        id: gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: -no-fail -exclude-generated -fmt sarif -out backend/gosec.sarif ./backend/...

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always()
        with:
          sarif_file: backend/gosec.sarif

      - name: gosec summary
        if: always()
        run: |
          RESULT="${{ steps.gosec.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ Scan completed (results uploaded to Security tab)"
          else
            STATUS="🔴 Scan failed"
          fi

          {
            echo "## Go Static Security Analysis"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Scanner | gosec (static analysis) |"
            echo "| Scope | backend/ |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('{0}~1', github.sha) }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Secret scan summary
        if: always()
        run: |
          RESULT="${{ steps.trufflehog.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No verified secrets found"
          else
            STATUS="🔴 Verified secrets detected"
          fi

          {
            echo "## Secret Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scanner | TruffleHog |"
            echo "| Mode | Verified secrets only |"
            echo "| Scope | Diff (${{ github.event_name }}) |"
            echo "| Result | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
