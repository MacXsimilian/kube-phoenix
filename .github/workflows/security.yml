name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "openapi.yaml"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Go vulnerability check ──────────────────────────────────────────────────
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: govulncheck
        id: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee /tmp/govulncheck.out && STATUS="clean" || STATUS="found"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          VULN_COUNT=$(grep -c '^Vulnerability' /tmp/govulncheck.out || true)
          echo "count=${VULN_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: govulncheck summary
        if: always()
        run: |
          STATUS="${{ steps.govulncheck.outputs.status }}"
          COUNT="${{ steps.govulncheck.outputs.count }}"
          if [ "$STATUS" = "clean" ]; then
            RESULT="✅ No known vulnerabilities"
          else
            RESULT="🔴 ${COUNT} vulnerabilit$([ "$COUNT" = "1" ] && echo 'y' || echo 'ies') found"
          fi

          {
            echo "## Go Vulnerability Check"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Scanner | govulncheck (call-graph analysis) |"
            echo "| Result | ${RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── npm audit ───────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit
        id: npm_audit
        run: |
          AUDIT=$(npm audit --omit=dev 2>&1) && STATUS="clean" || STATUS="found"
          echo "$AUDIT"
          HIGH=$(echo "$AUDIT" | grep -oP '\d+ high' | grep -oP '\d+' || echo 0)
          CRITICAL=$(echo "$AUDIT" | grep -oP '\d+ critical' | grep -oP '\d+' || echo 0)
          MODERATE=$(echo "$AUDIT" | grep -oP '\d+ moderate' | grep -oP '\d+' || echo 0)
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "moderate=${MODERATE}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          # Fail only on high+
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then exit 1; fi

      - name: npm audit summary
        if: always()
        run: |
          CRIT="${{ steps.npm_audit.outputs.critical }}"
          HIGH="${{ steps.npm_audit.outputs.high }}"
          MOD="${{ steps.npm_audit.outputs.moderate }}"

          if [ "$CRIT" -gt 0 ] 2>/dev/null; then
            RESULT="🔴 ${CRIT} critical, ${HIGH} high, ${MOD} moderate"
          elif [ "$HIGH" -gt 0 ] 2>/dev/null; then
            RESULT="🟡 ${HIGH} high, ${MOD} moderate"
          elif [ "$MOD" -gt 0 ] 2>/dev/null; then
            RESULT="🟢 ${MOD} moderate (no high/critical)"
          else
            RESULT="✅ No known vulnerabilities"
          fi

          {
            echo "## npm Audit"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Node | $(node -v) |"
            echo "| Scope | production dependencies only |"
            echo "| Critical | ${CRIT} |"
            echo "| High | ${HIGH} |"
            echo "| Moderate | ${MOD} |"
            echo "| Result | ${RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy container image scan ──────────────────────────────────────────────
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image for scanning
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          load: true
          tags: kube-phoenix:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        id: trivy_image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: kube-phoenix:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Trivy image summary
        if: always()
        run: |
          RESULT="${{ steps.trivy_image.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No critical/high vulnerabilities"
          else
            STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Container Image Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Image | kube-phoenix:scan |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy filesystem scan (IaC + deps) ─────────────────────────────────────
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trivy filesystem scan
        id: trivy_fs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif

      - name: Trivy filesystem summary
        if: always()
        run: |
          RESULT="${{ steps.trivy_fs.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No critical/high vulnerabilities"
          else
            STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Filesystem Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scope | IaC + dependencies |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10 # v3.94.1
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('{0}~1', github.sha) }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Secret scan summary
        if: always()
        run: |
          RESULT="${{ steps.trufflehog.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No verified secrets found"
          else
            STATUS="🔴 Verified secrets detected"
          fi

          {
            echo "## Secret Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scanner | TruffleHog |"
            echo "| Mode | Verified secrets only |"
            echo "| Scope | Diff (${{ github.event_name }}) |"
            echo "| Result | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
