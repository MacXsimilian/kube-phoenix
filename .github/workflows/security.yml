name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Go vulnerability check ──────────────────────────────────────────────────
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy OpenAPI spec into embed path
        run: cp openapi.yaml backend/internal/docs/openapi.yaml

      - name: govulncheck
        id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.27"
          work-dir: backend
          output-format: sarif
          output-file: govulncheck.sarif
          repo-checkout: false

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: govulncheck.sarif

      - name: govulncheck summary
        if: always()
        run: |
          RESULT="${{ steps.govulncheck.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ Scan completed (results uploaded to Security tab)"
          else
            STATUS="🔴 Scan failed"
          fi

          {
            echo "## Go Vulnerability Check"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scanner | govulncheck (call-graph analysis) |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── npm audit ───────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit
        id: npm_audit
        run: |
          AUDIT=$(npm audit --omit=dev 2>&1) && STATUS="clean" || STATUS="found"
          echo "$AUDIT"
          HIGH=$(echo "$AUDIT" | grep -oP '\d+ high' | grep -oP '\d+' || echo 0)
          CRITICAL=$(echo "$AUDIT" | grep -oP '\d+ critical' | grep -oP '\d+' || echo 0)
          MODERATE=$(echo "$AUDIT" | grep -oP '\d+ moderate' | grep -oP '\d+' || echo 0)
          {
            echo "high=${HIGH}"
            echo "critical=${CRITICAL}"
            echo "moderate=${MODERATE}"
            echo "status=${STATUS}"
          } >> "$GITHUB_OUTPUT"
          # Fail only on high+
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then exit 1; fi

      - name: npm audit summary
        if: always()
        run: |
          CRIT="${{ steps.npm_audit.outputs.critical }}"
          HIGH="${{ steps.npm_audit.outputs.high }}"
          MOD="${{ steps.npm_audit.outputs.moderate }}"

          if [ "$CRIT" -gt 0 ] 2>/dev/null; then
            RESULT="🔴 ${CRIT} critical, ${HIGH} high, ${MOD} moderate"
          elif [ "$HIGH" -gt 0 ] 2>/dev/null; then
            RESULT="🟡 ${HIGH} high, ${MOD} moderate"
          elif [ "$MOD" -gt 0 ] 2>/dev/null; then
            RESULT="🟢 ${MOD} moderate (no high/critical)"
          else
            RESULT="✅ No known vulnerabilities"
          fi

          {
            echo "## npm Audit"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Node | $(node -v) |"
            echo "| Scope | production dependencies only |"
            echo "| Critical | ${CRIT} |"
            echo "| High | ${HIGH} |"
            echo "| Moderate | ${MOD} |"
            echo "| Result | ${RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy container image scan ──────────────────────────────────────────────
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Register cache restore before cache-dance so post steps extract before saving.
      - name: Restore BuildKit cache mounts
        id: mount-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-mounts
          key: buildkit-mounts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'frontend/package-lock.json', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            buildkit-mounts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'frontend/package-lock.json', 'backend/go.sum') }}-

      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit == 'true' }}
          cache-map: |
            {
              "${{ runner.temp }}/buildkit-mounts/npm": "/root/.npm",
              "${{ runner.temp }}/buildkit-mounts/next": "/app/frontend/.next/cache",
              "${{ runner.temp }}/buildkit-mounts/go-mod": "/go/pkg/mod",
              "${{ runner.temp }}/buildkit-mounts/go-build": "/root/.cache/go-build"
            }

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kube-phoenix:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image vuln scan
        id: trivy_image_vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-phoenix:scan
          scanners: vuln
          format: sarif
          output: trivy-image-vuln.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image misconfig scan
        id: trivy_image_misconfig
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-phoenix:scan
          scanners: misconfig
          format: sarif
          output: trivy-image-misconfig.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivy-config: .github/trivy.yaml
          trivyignores: .trivyignore

      - name: Upload vuln SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-image-vuln.sarif
          category: trivy-image-vuln

      - name: Upload misconfig SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-image-misconfig.sarif
          category: trivy-image-misconfig

      - name: Trivy image summary
        if: always()
        run: |
          VULN="${{ steps.trivy_image_vuln.outcome }}"
          if [ "$VULN" = "success" ]; then
            VULN_STATUS="✅ No critical/high vulnerabilities"
          else
            VULN_STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Container Image Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Image | kube-phoenix:scan |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Vulnerabilities (gating) | ${VULN_STATUS} |"
            echo "| Misconfigurations (informational) | SARIF uploaded to Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy filesystem scan (IaC + deps) ─────────────────────────────────────
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem vuln scan
        id: trivy_fs_vuln
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs-vuln.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy filesystem misconfig scan
        id: trivy_fs_misconfig
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: sarif
          output: trivy-fs-misconfig.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivy-config: .github/trivy.yaml
          trivyignores: .trivyignore

      - name: Upload vuln SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-fs-vuln.sarif
          category: trivy-fs-vuln

      - name: Upload misconfig SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-fs-misconfig.sarif
          category: trivy-fs-misconfig

      - name: Trivy filesystem summary
        if: always()
        run: |
          VULN="${{ steps.trivy_fs_vuln.outcome }}"
          if [ "$VULN" = "success" ]; then
            VULN_STATUS="✅ No critical/high vulnerabilities"
          else
            VULN_STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Filesystem Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scope | IaC + dependencies |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Vulnerabilities (gating) | ${VULN_STATUS} |"
            echo "| Misconfigurations (informational) | SARIF uploaded to Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Go static security analysis ─────────────────────────────────────────────
  gosec:
    name: Go static security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: gosec
        id: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -no-fail -exclude-generated -fmt sarif -out gosec.sarif ./...
          # gosec emits backend-relative paths; code scanning expects repository-relative paths.
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path("gosec.sarif")
          report = json.loads(path.read_text())

          def normalize(value):
              if isinstance(value, dict):
                  location = value.get("artifactLocation", {})
                  uri = location.get("uri")
                  if uri and not urlsplit(uri).scheme and not uri.startswith("/"):
                      location["uri"] = "backend/" + uri
                  for child in value.values():
                      normalize(child)
              elif isinstance(value, list):
                  for child in value:
                      normalize(child)

          normalize(report)
          path.write_text(json.dumps(report) + "\n")
          PY

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: backend/gosec.sarif

      - name: gosec summary
        if: always()
        run: |
          RESULT="${{ steps.gosec.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ Scan completed (results uploaded to Security tab)"
          else
            STATUS="🔴 Scan failed"
          fi

          {
            echo "## Go Static Security Analysis"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Scanner | gosec (static analysis) |"
            echo "| Scope | backend/ |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('{0}~1', github.sha) }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Secret scan summary
        if: always()
        run: |
          RESULT="${{ steps.trufflehog.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No verified secrets found"
          else
            STATUS="🔴 Verified secrets detected"
          fi

          {
            echo "## Secret Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scanner | TruffleHog |"
            echo "| Mode | Verified secrets only |"
            echo "| Scope | Diff (${{ github.event_name }}) |"
            echo "| Result | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
