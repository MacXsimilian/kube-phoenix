name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Go vulnerability check ──────────────────────────────────────────────────
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: govulncheck
        id: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... 2>&1 | tee /tmp/govulncheck.out && STATUS="clean" || STATUS="found"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          VULN_COUNT=$(grep -c '^Vulnerability' /tmp/govulncheck.out || true)
          echo "count=${VULN_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: govulncheck summary
        if: always()
        run: |
          STATUS="${{ steps.govulncheck.outputs.status }}"
          COUNT="${{ steps.govulncheck.outputs.count }}"
          if [ "$STATUS" = "clean" ]; then
            RESULT="✅ No known vulnerabilities"
          else
            RESULT="🔴 ${COUNT} vulnerabilit$([ "$COUNT" = "1" ] && echo 'y' || echo 'ies') found"
          fi

          {
            echo "## Go Vulnerability Check"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Scanner | govulncheck (call-graph analysis) |"
            echo "| Result | ${RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── npm audit ───────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm audit
        id: npm_audit
        run: |
          AUDIT=$(npm audit --omit=dev 2>&1) && STATUS="clean" || STATUS="found"
          echo "$AUDIT"
          HIGH=$(echo "$AUDIT" | grep -oP '\d+ high' | grep -oP '\d+' || echo 0)
          CRITICAL=$(echo "$AUDIT" | grep -oP '\d+ critical' | grep -oP '\d+' || echo 0)
          MODERATE=$(echo "$AUDIT" | grep -oP '\d+ moderate' | grep -oP '\d+' || echo 0)
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "moderate=${MODERATE}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          # Fail only on high+
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then exit 1; fi

      - name: npm audit summary
        if: always()
        run: |
          CRIT="${{ steps.npm_audit.outputs.critical }}"
          HIGH="${{ steps.npm_audit.outputs.high }}"
          MOD="${{ steps.npm_audit.outputs.moderate }}"

          if [ "$CRIT" -gt 0 ] 2>/dev/null; then
            RESULT="🔴 ${CRIT} critical, ${HIGH} high, ${MOD} moderate"
          elif [ "$HIGH" -gt 0 ] 2>/dev/null; then
            RESULT="🟡 ${HIGH} high, ${MOD} moderate"
          elif [ "$MOD" -gt 0 ] 2>/dev/null; then
            RESULT="🟢 ${MOD} moderate (no high/critical)"
          else
            RESULT="✅ No known vulnerabilities"
          fi

          {
            echo "## npm Audit"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Node | $(node -v) |"
            echo "| Scope | production dependencies only |"
            echo "| Critical | ${CRIT} |"
            echo "| High | ${HIGH} |"
            echo "| Moderate | ${MOD} |"
            echo "| Result | ${RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy container image scan ──────────────────────────────────────────────
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: kube-phoenix:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        id: trivy_image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-phoenix:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Trivy image summary
        if: always()
        run: |
          RESULT="${{ steps.trivy_image.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No critical/high vulnerabilities"
          else
            STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Container Image Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Image | kube-phoenix:scan |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Trivy filesystem scan (IaC + deps) ─────────────────────────────────────
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trivy filesystem scan
        id: trivy_fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-fs.sarif

      - name: Trivy filesystem summary
        if: always()
        run: |
          RESULT="${{ steps.trivy_fs.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No critical/high vulnerabilities"
          else
            STATUS="🔴 Vulnerabilities found (see Security tab)"
          fi

          {
            echo "## Trivy Filesystem Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scope | IaC + dependencies |"
            echo "| Severity filter | CRITICAL, HIGH |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Go static security analysis ─────────────────────────────────────────────
  gosec:
    name: Go static security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Copy OpenAPI spec into embed path
        run: cp ../openapi.yaml internal/docs/openapi.yaml

      - name: gosec
        id: gosec
        uses: securego/gosec@4a3bd8af174872c778439083ded7adbf3747e770 # v2.26.1
        with:
          args: -no-fail -exclude-generated -fmt sarif -out backend/gosec.sarif ./backend/...

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: backend/gosec.sarif

      - name: gosec summary
        if: always()
        run: |
          RESULT="${{ steps.gosec.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ Scan completed (results uploaded to Security tab)"
          else
            STATUS="🔴 Scan failed"
          fi

          {
            echo "## Go Static Security Analysis"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Go | $(go version | awk '{print $3}') |"
            echo "| Scanner | gosec (static analysis) |"
            echo "| Scope | backend/ |"
            echo "| Result | ${STATUS} |"
            echo "| SARIF | Uploaded to GitHub Security tab |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('{0}~1', github.sha) }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Secret scan summary
        if: always()
        run: |
          RESULT="${{ steps.trufflehog.outcome }}"
          if [ "$RESULT" = "success" ]; then
            STATUS="✅ No verified secrets found"
          else
            STATUS="🔴 Verified secrets detected"
          fi

          {
            echo "## Secret Scan"
            echo ""
            echo "| Item | Value |"
            echo "|:-----|:------|"
            echo "| Scanner | TruffleHog |"
            echo "| Mode | Verified secrets only |"
            echo "| Scope | Diff (${{ github.event_name }}) |"
            echo "| Result | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
