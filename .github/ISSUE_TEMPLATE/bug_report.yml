name: Bug Report
description: Report a bug in kube-phoenix
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: kube-phoenix version
      description: Output of the version endpoint or Helm release version.
      placeholder: "v0.5.0"
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      description: Output of `kubectl version --short`.
      placeholder: "v1.29.2"
    validations:
      required: true

  - type: input
    id: helm-version
    attributes:
      label: Helm chart version
      description: Version of the kube-phoenix Helm chart, if applicable.
      placeholder: "0.5.0"
    validations:
      required: false

  - type: dropdown
    id: deployment-method
    attributes:
      label: Deployment method
      options:
        - Helm
        - Manual manifests
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Paste relevant log output or attach screenshots. Use a code block for logs.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might help diagnose the issue.
    validations:
      required: false
