services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: kube_phoenix
      POSTGRES_PASSWORD: kube_phoenix
      POSTGRES_DB: kube_phoenix
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kube_phoenix -d kube_phoenix"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uses backend-builder stage (not distroless) for local dev — includes shell for debugging
  backend:
    build:
      context: .
      target: backend-builder
    command: /bin/kube-phoenix
    environment:
      DATABASE_URL: "host=postgres user=kube_phoenix password=kube_phoenix dbname=kube_phoenix port=5432 sslmode=disable"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
